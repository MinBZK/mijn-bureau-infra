apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "common.names.fullname" . }}-keygen
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: synapse-keygen
  {{- if .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished | default 100 }}
  backoffLimit:  {{ .Values.job.backoffLimit | default 6 }}
  template:
    metadata:
      labels: {{- include "common.labels.matchLabels" . | nindent 8 }}
        app.kubernetes.io/component: synapse-keygen
      annotations:
        {{- if .Values.job.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.job.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
        helm.sh/hook: post-install,post-upgrade
        helm.sh/hook-delete-policy: before-hook-creation
    spec:
      {{- include "synapse.imagePullSecrets" . | nindent 6 }}
      restartPolicy: {{ .Values.job.restartPolicy | default "OnFailure" }}
      serviceAccountName: {{ template "synapse.serviceAccountName" . }}-keygen
      {{- if .Values.master.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.master.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.synapse.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" ( dict "value" .Values.synapse.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.synapse.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.synapse.tolerations "context" .) | nindent 8 }}
      {{- end }}
      initContainers:
        - name: keygen
          image: {{ template "synapse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.master.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.master.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              key_file=/synapse/keys/synapse_signing_key
              if [ -f /existing/synapse_signing_key ]; then
                echo "Secret 'synapse-signing-key' already exists, reusing signing key"
                key_file=/existing/synapse_signing_key
              else
                synapse_homeserver \
                  --config-path /synapse/config/homeserver.yaml \
                  --config-path /synapse/secrets/secrets.yaml \
                  --generate-keys
              fi

              # Render a Secret manifest so the kubectl container does not need a shell.
              python3 - "$key_file" "$POD_NAMESPACE" <<'PY'
              import base64
              import sys

              key_file, namespace = sys.argv[1], sys.argv[2]
              with open(key_file, "rb") as key:
                  encoded = base64.b64encode(key.read()).decode()

              with open("/tmp/synapse-signing-key.yaml", "w") as manifest:
                  manifest.write(
                      "apiVersion: v1\n"
                      "kind: Secret\n"
                      "metadata:\n"
                      "  name: synapse-signing-key\n"
                      f"  namespace: {namespace}\n"
                      "type: Opaque\n"
                      "data:\n"
                      f"  synapse_signing_key: {encoded}\n"
                  )
              PY
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.job.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /synapse/config
              name: synapse
              readOnly: true
            - mountPath: /synapse/secrets
              name: synapse-secrets
              readOnly: true
            - name: synapse-keys
              mountPath: /synapse/keys
            - name: existing-signing-key
              mountPath: /existing
              readOnly: true
            - name: empty-dir
              mountPath: /tmp
      containers:
        - name: create-signing-key
          image: {{ template "synapse.kubectl.image" . }}
          imagePullPolicy: {{ .Values.job.kubectl.image.pullPolicy }}
          {{- if .Values.master.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.master.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          command:
            - /bin/kubectl
          args:
            - apply
            - -f
            - /tmp/synapse-signing-key.yaml
          env:
            - name: HOME
              value: /tmp
          {{- if .Values.job.resources }}
          resources:
            {{- toYaml .Values.job.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: empty-dir
              mountPath: /tmp
      volumes:
        - name: synapse-keys
          emptyDir: {}
        - name: existing-signing-key
          secret:
            secretName: synapse-signing-key
            optional: true
        - name: synapse
          configMap:
            defaultMode: 420
            name: {{ include "common.names.fullname" . }}
        - name: synapse-secrets
          secret:
            secretName: {{ include "synapse.secretName" . }}
        - name: empty-dir
          emptyDir: {}
