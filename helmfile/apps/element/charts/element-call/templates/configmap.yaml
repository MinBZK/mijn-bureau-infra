apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-config
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: element-call
    app.kubernetes.io/part-of: matrix
  {{- with .Values.commonAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": {{ .Values.config.homeserverBaseUrl | quote }},
          "server_name": {{ .Values.config.homeserverServerName | quote }}
        }
      },
      "livekit": {
        "livekit_service_url": {{ .Values.config.livekitServiceUrl | quote }}
      },
      "ssla": "https://static.element.io/legal/element-software-and-services-license-agreement-uk-1.pdf",
      "matrix_rtc_mode": {{ .Values.config.matrixRtcMode | quote }},
      "matrix_rtc_session": {
        "membership_event_expiry_ms": {{ int .Values.config.membershipEventExpiryMs }},
        "network_error_retry_ms": {{ int .Values.config.networkErrorRetryMs }}
      }
    }
