apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: mas
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # Sensitive part of the MAS configuration. Merged by mas-cli with the
  # ConfigMap-held http block (multiple --config flags). All secret material
  # is referenced via `*_file` paths pointing at the mounted Secret volumes.
  secrets.yaml: |
    database:
      host: {{ .Values.config.database.host | quote }}
      port: {{ .Values.config.database.port }}
      database: {{ .Values.config.database.database | quote }}
      username: {{ .Values.config.database.username | quote }}
      password_file: /etc/mas/database-password
      max_connections: {{ .Values.config.database.maxConnections }}
      min_connections: {{ .Values.config.database.minConnections }}
      connect_timeout: {{ .Values.config.database.connectTimeout }}
      idle_timeout: {{ .Values.config.database.idleTimeout }}
      max_lifetime: {{ .Values.config.database.maxLifetime }}
    email:
      from: {{ .Values.config.email.from | quote }}
      reply_to: {{ .Values.config.email.replyTo | quote }}
      transport: {{ .Values.config.email.transport | quote }}
      {{- if eq .Values.config.email.transport "smtp" }}
      mode: {{ .Values.config.email.mode | quote }}
      hostname: {{ .Values.config.email.hostname | quote }}
      port: {{ .Values.config.email.port }}
      {{- if .Values.config.email.username }}
      username: {{ .Values.config.email.username | quote }}
      password_file: /etc/mas/smtp-password
      {{- end }}
      {{- end }}
    secrets:
      encryption_file: /secrets/encryption
      keys:
        - kid: "default"
          key_file: /secrets/signing-key.pem
    matrix:
      homeserver: {{ .Values.config.matrix.homeserver | quote }}
      endpoint: {{ .Values.config.matrix.endpoint | quote }}
      secret_file: /secrets/matrix-secret
    clients:
      {{- range $index, $client := .Values.config.clients }}
      - client_id: {{ $client.clientId | quote }}
        client_auth_method: {{ $client.clientAuthMethod | default "client_secret_basic" | quote }}
        client_secret_file: {{ printf "/secrets/client-secret-%d" $index | quote }}
        {{- with $client.redirectUris }}
        redirect_uris: {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      []
      {{- end }}
    passwords:
      enabled: {{ .Values.config.passwords.enabled }}
      minimum_complexity: {{ .Values.config.passwords.minimumComplexity }}
      schemes:
        - version: 1
          algorithm: argon2id
    account:
      password_registration_enabled: {{ .Values.config.account.passwordRegistrationEnabled }}
    templates:
      path: /usr/local/share/mas-cli/templates/
      assets_manifest: /usr/local/share/mas-cli/manifest.json
      translations_path: /usr/local/share/mas-cli/translations/
    policy:
      wasm_module: /usr/local/share/mas-cli/policy.wasm
      client_registration_entrypoint: client_registration/violation
      register_entrypoint: register/violation
      authorization_grant_entrypoint: authorization_grant/violation
      password_entrypoint: password/violation
      email_entrypoint: email/violation
      data:
        {{- $policyData := dict "client_registration" (dict "allow_insecure_uris" true "allow_missing_contacts" true) "admin_users" (list) }}
        {{- $policyData = merge $policyData .Values.config.policy.extraData }}
        {{- toYaml $policyData | nindent 8 }}
    branding:
      service_name: {{ .Values.config.branding.serviceName | toJson }}
      policy_uri: {{ .Values.config.branding.policyUri | toJson }}
      tos_uri: {{ .Values.config.branding.tosUri | toJson }}
      imprint: {{ .Values.config.branding.imprint | toJson }}
      logo_uri: {{ .Values.config.branding.logoUri | toJson }}
    upstream_oauth2:
      providers:
        {{- toYaml .Values.config.upstreamOauth2.providers | nindent 8 }}
    experimental:
      access_token_ttl: {{ .Values.config.experimental.accessTokenTtl }}
      compat_token_ttl: {{ .Values.config.experimental.compatTokenTtl }}
  database-password: {{ .Values.config.database.password | quote }}
  {{- if .Values.config.email.username }}
  smtp-password: {{ .Values.config.email.password | quote }}
  {{- end }}
