{{- if not .Values.secrets.external }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
type: Opaque
stringData:
  LIVEKIT_KEY: {{ .Values.livekit.key | quote }}
  LIVEKIT_SECRET: {{ .Values.livekit.secret | quote }}
  {{- if .Values.livekit.asToken }}
  LIVEKIT_AS_TOKEN: {{ .Values.livekit.asToken | quote }}
  {{- end }}
  {{- if .Values.livekit.hsToken }}
  LIVEKIT_HS_TOKEN: {{ .Values.livekit.hsToken | quote }}
  {{- end }}
{{- end }}
