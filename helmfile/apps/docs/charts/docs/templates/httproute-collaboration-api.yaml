{{- if eq .Values.cluster.routingMode "gateway-api" }}
{{- if .Values.ingressCollaborationApi.enabled }}
# v6: the public collaboration API paths are served by yhub. The legacy
# /collaboration/api/ prefix is kept as a fallback alongside the v6 paths
# (http-fallback, history, restore and the public yhub JWKS). Backend-internal
# routes (prune, migrate, reset-connections, create-ydoc, ...) stay off the
# gateway on purpose: the backend reaches them through the cluster service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "docs.yhub.fullname" . }}-api
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: y-hub
  {{- include "common.httproute.annotations" . | nindent 2 }}
spec:
  parentRefs:
    {{- include "common.httproute.parentRef" .Values.cluster.gateway | nindent 4 }}
  hostnames:
    - {{ .Values.ingressCollaborationApi.hostname | quote }}
  rules:
    - matches:
        {{- range .Values.ingressCollaborationApi.paths | default (list (.Values.ingressCollaborationApi.path | default "/collaboration/api/")) }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      filters:
        {{- include "common.httproute.hstsFilter" . | nindent 8 }}
      backendRefs:
        - name: {{ include "docs.yhub.fullname" . }}
          port: {{ .Values.yhub.service.ports.http }}
{{- end }}
{{- end }}
