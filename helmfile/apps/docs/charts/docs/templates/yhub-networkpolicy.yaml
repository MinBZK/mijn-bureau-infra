{{- if and .Values.yhub.enabled .Values.yhub.networkPolicy.enabled }}
apiVersion: {{ include "common.capabilities.networkPolicy.apiVersion" . }}
kind: NetworkPolicy
metadata:
  name: {{ template "docs.yhub.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: y-hub
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.yhub.podLabels .Values.commonLabels ) "context" $ ) }}
  podSelector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
      app.kubernetes.io/component: y-hub
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- if .Values.yhub.networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    {{- include "common.networkPolicy.dnsEgress" (dict "context" $) | nindent 4 }}
    {{- if .Values.yhub.networkPolicy.extraEgress }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.yhub.networkPolicy.extraEgress "context" $ ) | nindent 4 }}
    {{- end }}
    {{- end }}
  ingress:
    # The whole /collaboration/ prefix (websocket included) reaches yhub
    # through the HTTPRoutes, so traffic arrives from the gateway, not from
    # pods in this namespace.
    - ports:
        - port: {{ .Values.yhub.containerPorts.http }}
      {{- if not .Values.yhub.networkPolicy.allowExternal }}
      from:
        - podSelector:
            matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 14 }}
        # The Docs backend calls the yhub REST API (seed, migrate, reset-connections)
        - podSelector:
            matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 14 }}
              app.kubernetes.io/component: backend
        {{- if .Values.yhub.networkPolicy.ingressNSMatchLabels }}
        - namespaceSelector:
            matchLabels: {{- include "common.tplvalues.render" (dict "value" .Values.yhub.networkPolicy.ingressNSMatchLabels "context" $ ) | nindent 14 }}
          {{- if .Values.yhub.networkPolicy.ingressNSPodMatchLabels }}
          podSelector:
            matchLabels: {{- include "common.tplvalues.render" (dict "value" .Values.yhub.networkPolicy.ingressNSPodMatchLabels "context" $ ) | nindent 14 }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- if .Values.yhub.networkPolicy.extraIngress }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.yhub.networkPolicy.extraIngress "context" $ ) | nindent 4 }}
    {{- end }}
{{- end }}
