{{- if not .Values.vaultwarden.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: vaultwarden
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  admin-token: {{ include "common.secrets.passwords.manage" (dict "secret" (include "common.names.fullname" .) "key" "admin-token" "providedValues" (list "vaultwarden.adminToken") "length" 64 "context" $) }}
  {{- if .Values.database.host }}
  database-url: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.database.user .Values.database.password .Values.database.host .Values.database.port .Values.database.name | b64enc | quote }}
  {{- end }}
  {{- if .Values.vaultwarden.sso.enabled }}
  sso-client-secret: {{ .Values.vaultwarden.sso.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}
