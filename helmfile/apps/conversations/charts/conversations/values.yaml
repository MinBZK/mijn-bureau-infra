  ## ONLY FOR STATEFULSETS:
  ## @param conversations.updateStrategy.type conversations statefulset strategy type
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#update-strategies
  ##
  updateStrategy:
    ## ONLY FOR DEPLOYMENTS:
    ## Can be set to RollingUpdate or Recreate
    ## ONLY FOR STATEFULSETS:
    ## Can be set to RollingUpdate or OnDelete
    ##
    type: RollingUpdate
  ## ONLY FOR STATEFULSETS:
  ## @param conversations.podManagementPolicy Pod management policy for conversations statefulset
  ## Ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#pod-management-policies
  ##
  podManagementPolicy: OrderedReady
  ## @param conversations.priorityClassName conversations pods' priorityClassName
  ##
  priorityClassName: ""
  ## @param conversations.topologySpreadConstraints Topology Spread Constraints for conversations pod assignment spread across your cluster among failure-domains
  ## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/#spread-constraints-for-pods
  ##
  topologySpreadConstraints: []
  ## @param conversations.schedulerName Name of the k8s scheduler (other than default) for conversations pods
  ## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
  ##
  schedulerName: ""
  ## @param conversations.runtimeClassName Name of the runtime class name for conversations pods
  ## ref: https://kubernetes.io/docs/concepts/containers/runtime-class/#usage
  ##
  runtimeClassName: ""
  ## @param conversations.terminationGracePeriodSeconds Seconds conversations pods need to terminate gracefully
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
  ##
  terminationGracePeriodSeconds: ""
  ## @param conversations.lifecycleHooks for conversations containers to automate configuration before or after startup
  ##
  lifecycleHooks: {}
  ## @param conversations.extraEnvVars Array with extra environment variables to add to conversations containers
  ## e.g:
  ## extraEnvVars:
  ##   - name: FOO
  ##     value: "bar"
  ##
  extraEnvVars: []
  ## @param conversations.extraEnvVarsCM Name of existing ConfigMap containing extra env vars for conversations containers
  ##
  extraEnvVarsCM: ""
  ## @param conversations.extraEnvVarsSecret Name of existing Secret containing extra env vars for conversations containers
  ##
  extraEnvVarsSecret: ""
  ## @param conversations.extraVolumes Optionally specify extra list of additional volumes for the conversations pods
  ##
  extraVolumes: []
  ## @param conversations.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the conversations containers
  ##
  extraVolumeMounts: []
  ## @param conversations.sidecars Add additional sidecar containers to the conversations pods
  ## e.g:
  ## sidecars:
  ##   - name: your-image-name
  ##     image: your-image
  ##     imagePullPolicy: Always
  ##     ports:
  ##       - name: portname
  ##         containerPort: 1234
  ##
  sidecars: []
  ## @param conversations.initContainers Add additional init containers to the conversations pods
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  ## e.g:
  ## initContainers:
  ##  - name: your-image-name
  ##    image: your-image
  ##    imagePullPolicy: Always
  ##    command: ['sh', '-c', 'echo "hello world"']
  ##
  initContainers: []
  ## Pod Disruption Budget configuration
  ## ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb
  ## @param conversations.pdb.create Enable/disable a Pod Disruption Budget creation
  ## @param conversations.pdb.minAvailable Minimum number/percentage of pods that should remain scheduled
  ## @param conversations.pdb.maxUnavailable Maximum number/percentage of pods that may be made unavailable. Defaults to `1` if both `conversations.pdb.minAvailable` and `conversations.pdb.maxUnavailable` are empty.
  ##
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""
  ## Autoscaling configuration
  ## ref: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  ##
  autoscaling:
    ## @param conversations.autoscaling.vpa.enabled Enable VPA for conversations pods
    ## @param conversations.autoscaling.vpa.annotations Annotations for VPA resource
    ## @param conversations.autoscaling.vpa.controlledResources VPA List of resources that the vertical pod autoscaler can control. Defaults to cpu and memory
    ## @param conversations.autoscaling.vpa.maxAllowed VPA Max allowed resources for the pod
    ## @param conversations.autoscaling.vpa.minAllowed VPA Min allowed resources for the pod
    ##
    vpa:
      enabled: false
      annotations: {}
      controlledResources: []
      maxAllowed: {}
      minAllowed: {}
      ## @param conversations.autoscaling.vpa.updatePolicy.updateMode Autoscaling update policy
      ## Specifies whether recommended updates are applied when a Pod is started and whether recommended updates are applied during the life of a Pod
      ## Possible values are "Off", "Initial", "Recreate", and "Auto".
      ##
      updatePolicy:
        updateMode: Recreate
    ## @param conversations.autoscaling.hpa.enabled Enable HPA for conversations pods
    ## @param conversations.autoscaling.hpa.minReplicas Minimum number of replicas
    ## @param conversations.autoscaling.hpa.maxReplicas Maximum number of replicas
    ## @param conversations.autoscaling.hpa.targetCPU Target CPU utilization percentage
    ## @param conversations.autoscaling.hpa.targetMemory Target Memory utilization percentage
    ##
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: ""
## @section Traffic Exposure Parameters
##

job:
  command:
    - /bin/sh
  args:
    - -c
    - |
      while ! python manage.py check --database default > /dev/null 2>&1
      do
        echo "Database not ready"
        sleep 2
      done
      echo "Database is ready"

      python manage.py migrate --no-input
  commandSuperuser:
    - /bin/sh
  argsSuperuser:
    - -c
    - |
      python manage.py createsuperuser --email $DJANGO_SUPERUSER_EMAIL --password $DJANGO_SUPERUSER_PASSWORD
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  podAnnotations: {}
  resources: {}
