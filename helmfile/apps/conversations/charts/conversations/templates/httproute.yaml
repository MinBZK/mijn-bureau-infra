{{- if eq .Values.cluster.routingMode "gateway-api" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: conversations
  {{- include "common.httproute.annotations" . | nindent 2 }}
spec:
  parentRefs:
    {{- include "common.httproute.parentRef" .Values.cluster.gateway | nindent 4 }}
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /static
      filters:
        {{- include "common.httproute.hstsFilter" . | nindent 8 }}
      backendRefs:
        - name: {{ printf "%s-backend" (include "common.names.fullname" .) }}
          port: 80
      # Chat answers stream for tens of seconds and agent turns with documents
      # can take minutes; Envoy's default route timeout would cut the SSE
      # stream off mid-turn, surfacing as an error in the UI.
      timeouts:
        request: {{ .Values.ingress.apiRequestTimeout | default "600s" | quote }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- include "common.httproute.hstsFilter" . | nindent 8 }}
      backendRefs:
        - name: {{ printf "%s-frontend" (include "common.names.fullname" .) }}
          port: 80
{{- end }}
