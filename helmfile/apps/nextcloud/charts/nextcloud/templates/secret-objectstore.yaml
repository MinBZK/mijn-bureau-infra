{{- if and (not .Values.externalObjectStore.existingSecret) .Values.externalObjectStore.username .Values.externalObjectStore.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-externalobjectstore" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: nextcloud
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ include "nextcloud.objectstore.secretUsernameKey" . }}: {{ .Values.externalObjectStore.username | b64enc | quote }}
  {{ include "nextcloud.objectstore.secretPasswordKey" . }}: {{ .Values.externalObjectStore.password | b64enc | quote }}
  {{- if .Values.externalObjectStore.sseKey }}
  sse-c-key: {{ .Values.externalObjectStore.sseKey | b64enc | quote }}
  {{- end }}
{{- end -}}
