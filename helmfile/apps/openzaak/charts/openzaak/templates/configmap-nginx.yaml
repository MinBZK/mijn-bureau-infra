apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openzaak.nginxConfigMapName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: openzaak-nginx
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  default.conf: |
    server {
        listen       {{ .Values.nginx.containerPorts.http }};
        server_name  {{ .Values.ingress.hostname | default "_" }};

        # Uploaded documents; only reachable via X-Accel-Redirect issued by
        # Open Zaak after authorisation checks.
        location ^~ /private-media {
            internal;
            alias /private-media/;
        }

        location / {
            client_max_body_size 100M;
            proxy_pass         http://{{ include "openzaak.webServiceName" . }}:{{ .Values.service.ports.http }};
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
