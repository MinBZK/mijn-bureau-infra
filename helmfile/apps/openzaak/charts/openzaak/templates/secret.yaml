{{- $redisAuth := ternary (printf "default:%s@" .Values.externalRedis.password) "" (not (empty .Values.externalRedis.password)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openzaak.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: openzaak
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.settings.secretKey | quote }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  # The settings layer prefixes these with redis:// itself
  CACHE_DEFAULT: {{ printf "%s%s:%s/0" $redisAuth .Values.externalRedis.host .Values.externalRedis.port | quote }}
  CACHE_AXES: {{ printf "%s%s:%s/1" $redisAuth .Values.externalRedis.host .Values.externalRedis.port | quote }}
  CELERY_BROKER_URL: {{ printf "redis://%s%s:%s/2" $redisAuth .Values.externalRedis.host .Values.externalRedis.port | quote }}
  CELERY_RESULT_BACKEND: {{ printf "redis://%s%s:%s/2" $redisAuth .Values.externalRedis.host .Values.externalRedis.port | quote }}
  {{- if and .Values.settings.email.host .Values.settings.email.password }}
  EMAIL_HOST_PASSWORD: {{ .Values.settings.email.password | quote }}
  {{- end }}
