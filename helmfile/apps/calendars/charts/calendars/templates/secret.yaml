{{- $redisUrl := printf "redis://default:%s@%s:%s" .Values.externalRedis.password .Values.externalRedis.host .Values.externalRedis.port -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: calendars
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.backend.secretKey | quote }}
  SALT_KEY: {{ .Values.backend.saltKey | quote }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  PGPASSWORD: {{ .Values.externalDatabase.password | quote }}
  REDIS_URL: {{ printf "%s/0" $redisUrl | quote }}
  DRAMATIQ_BROKER_URL: {{ printf "%s/0" $redisUrl | quote }}
  DRAMATIQ_RESULT_BACKEND_URL: {{ printf "%s/1" $redisUrl | quote }}
  OIDC_RP_CLIENT_SECRET: {{ .Values.authentication.client.client_secret | quote }}
  EMAIL_HOST_PASSWORD: {{ .Values.smtp.password | quote }}
  CALDAV_INBOUND_API_KEY: {{ .Values.caldav.inboundApiKey | quote }}
  CALDAV_OUTBOUND_API_KEY: {{ .Values.caldav.outboundApiKey | quote }}
  CALDAV_INTERNAL_API_KEY: {{ .Values.caldav.internalApiKey | quote }}
  {{- if .Values.backend.messagesIntegration.enabled }}
  MESSAGES_API_KEY: {{ .Values.backend.messagesIntegration.apiKey | quote }}
  {{- end }}
