apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.names.fullname" . }}-logo
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: calendars-frontend
data:
  app-logotype.svg: {{ .Files.Get "files/app-logotype.svg" | quote }}
  app-icon.svg: {{ .Files.Get "files/app-icon.svg" | quote }}
