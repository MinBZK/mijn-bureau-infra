{{- if and .Values.messagesChannel.enabled .Values.messagesChannel.id .Values.messagesChannel.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-caldav-messages-channel
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: calendars
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  CALDAV_MESSAGES_CHANNEL_ID: {{ .Values.messagesChannel.id | quote }}
  CALDAV_MESSAGES_CHANNEL_TOKEN: {{ .Values.messagesChannel.token | quote }}
{{- end }}
