## @section Global parameters

global:
  ## Global Docker image parameters
  ##
  imageRegistry: ""
  imagePullSecrets: []
  ## @param global.defaultStorageClass Global default StorageClass for Persistent Volume(s)
  ##
  defaultStorageClass: ""
  ## Security parameters
  ##
  security:
    allowInsecureImages: false
  ## Compatibility adaptations for Kubernetes platforms
  ##
  compatibility:
    openshift:
      adaptSecurityContext: auto
    omitEmptySeLinuxOptions: false

## @section Common parameters

kubeVersion: ""
apiVersions: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}
clusterDomain: cluster.local
extraDeploy: []
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section Cluster parameters

## Cluster routing configuration. Helmfile overrides these values through
## values-cluster-ingress.yaml.gotmpl.
##
cluster:
  routingMode: ingress
  ingress:
    type: nginx
    className: ""
    annotations: {}
  gateway: {}
  tls:
    selfSigned: false

## @section Calendars parameters

calendars:
  ## @param calendars.sidecars Add additional sidecar containers to the calendars pods
  ## e.g:
  ## sidecars:
  ##   - name: your-image-name
  ##     image: your-image
  ##     imagePullPolicy: Always
  ##     ports:
  ##       - name: portname
  ##         containerPort: 1234
  ##
  sidecars: []
  ## @param calendars.initContainers Add additional init containers to the calendars pods
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  ## e.g:
  ## initContainers:
  ##  - name: your-image-name
  ##    image: your-image
  ##    imagePullPolicy: Always
  ##    command: ['sh', '-c', 'echo "hello world"']
  ##
  initContainers: []

## @section Calendars backend parameters

## Django API server (gunicorn)
##
backend:
  image:
    registry: ghcr.io
    repository: suitenumerique/calendars-backend
    tag: main
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  replicaCount: 1
  containerPorts:
    http: 8000
  extraContainerPorts: []
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}
  resourcesPreset: "micro"
  resources: {}
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    privileged: false
    runAsUser: 1001
    runAsGroup: 1001
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  autoscaling:
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: ""
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: 1
  runtimeClassName: ""
  deploymentAnnotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  command: []
  args: []
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  extraVolumeMounts: []
  extraVolumes: []
  secretKey: ""
  saltKey: ""
  baseUrl: ""
  ## @param backend.logoutRedirectUrl Where the browser lands after logout. Empty falls back to baseUrl.
  logoutRedirectUrl: ""
  allowedHosts: ""
  csrfTrustedOrigins: ""
  languageCode: "nl-nl"
  frontendTheme: "default"
  frontendSilentLoginEnabled: true
  meetBaseUrl: ""
  messagesIntegration:
    enabled: false
    apiUrl: ""
    channelId: ""
    apiKey: ""

