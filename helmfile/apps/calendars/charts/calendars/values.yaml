## @section Database jobs

job:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  restartPolicy: OnFailure
  podAnnotations: {}
  resources: {}
  commandMigrate:
    - /bin/sh
  argsMigrate:
    - -c
    - |
      while ! python manage.py check --database default > /dev/null 2>&1
      do
        echo "Database not ready"
        sleep 2
      done
      echo "Database is ready"
      python manage.py migrate --noinput
  commandSuperuser:
    - /bin/sh
  argsSuperuser:
    - -c
    - |
      python manage.py createsuperuser --email "$DJANGO_SUPERUSER_EMAIL" --password "$DJANGO_SUPERUSER_PASSWORD"
  migrate:
    weight: "-10"
  superuser:
    weight: "0"
  caldavMessagesChannel:
    weight: "1"
  defaultLanguage:
    weight: "2"

## @section Default user language
## Post-install/upgrade hook that sets the default interface/email language
## for users without a language preference. The invitation mailer otherwise
## falls back to French.
##
defaultLanguage:
  enabled: true
  ## Language to apply (e.g. "nl-nl"). Empty falls back to backend.languageCode.
  code: ""
  ## CronJob repeating the same update, catching users created between
  ## deploys (they start without a language preference).
  cron:
    enabled: true
    schedule: "7 * * * *"
    concurrencyPolicy: Forbid
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3

## @section Messages-app CalDAV channel
## Global "caldav" channel provisioned for the LaSuite messages app.
## Password seen by messages = "<id><token>" (concatenated, no separator).
##
messagesChannel:
  enabled: false
  id: ""
  token: ""

