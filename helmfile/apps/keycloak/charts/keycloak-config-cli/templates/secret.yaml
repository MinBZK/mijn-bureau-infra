apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak-config-cli.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak-config-cli.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.import.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
