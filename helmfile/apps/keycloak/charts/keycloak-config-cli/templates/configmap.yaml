apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak-config-cli.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "keycloak-config-cli.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.import.files }}
  {{ $name }}: |
{{ $content | indent 4 }}
  {{- end }}
