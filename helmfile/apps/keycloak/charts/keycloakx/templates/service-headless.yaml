apiVersion: v1
kind: Service
metadata:
  name: {{ include "keycloak.fullname" . }}-headless
  namespace: {{ include "keycloak.namespace" . }}
  {{- with .Values.serviceHeadless.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{- printf "%s: %s" $key (tpl $value $ | quote) | nindent 4 }}
    {{- end }}
  {{- end }}
  labels:
    {{- $commonLabels := .Values.commonLabels | default dict }}
    {{- $serviceHeadlessLabels := .Values.serviceHeadless.labels | default dict }}
    {{- include "keycloak.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.serviceHeadless.labels }}
    {{- printf "%s: %s" $key (tpl $value $ | quote) | nindent 4 }}
    {{- end }}
    {{- if and (not (hasKey $commonLabels "app.kubernetes.io/component")) (not (hasKey $serviceHeadlessLabels "app.kubernetes.io/component")) }}
    app.kubernetes.io/component: headless
    {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    {{- with .Values.serviceHeadless.extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  selector:
    {{- include "keycloak.selectorLabels" . | nindent 4 }}
