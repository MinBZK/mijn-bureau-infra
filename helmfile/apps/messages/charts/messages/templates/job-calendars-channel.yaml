{{- if and .Values.job.calendarsChannel.enabled .Values.job.calendarsChannel.channelId .Values.job.calendarsChannel.apiKey }}
{{- /* Provision the global "api_key" Channel the calendars app uses to
  list mailboxes and submit mailbox invitations. Idempotent:
  update_or_create on a deterministic id keeps the channel and key hash in
  sync. Runs after the migrate (weight -20) and superuser (weight 0) jobs. */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-calendars-channel
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: messages-calendars-channel
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list (dict "helm.sh/hook" "post-install,post-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" "helm.sh/hook-weight" .Values.job.calendarsChannel.weight) .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
spec:
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.job.backoffLimit }}
  template:
    metadata:
      labels: {{- include "common.labels.matchLabels" . | nindent 8 }}
        app.kubernetes.io/component: messages-calendars-channel
      {{- if .Values.job.podAnnotations }}
      annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.job.podAnnotations "context" $) | nindent 8 }}
      {{- end }}
    spec:
      {{- include "messages.imagePullSecrets" . | nindent 6 }}
      restartPolicy: {{ .Values.job.restartPolicy }}
      serviceAccountName: {{ include "messages.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- if .Values.backend.runtimeClassName }}
      runtimeClassName: {{ .Values.backend.runtimeClassName | quote }}
      {{- end }}
      {{- if .Values.backend.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.backend.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.backend.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.backend.tolerations "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.backend.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.backend.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "common.names.fullname" . }}-calendars-channel
          image: {{ include "messages.backend.image" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- if .Values.backend.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.backend.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
          args:
            - -c
            - |
              python manage.py shell -c "import hashlib, os, uuid; from core.models import Channel; cid=os.environ['CALENDARS_CHANNEL_ID']; key=os.environ['CALENDARS_CHANNEL_API_KEY']; digest=hashlib.sha256(key.encode()).hexdigest(); Channel.objects.update_or_create(id=uuid.UUID(cid), defaults=dict(name='Calendars (platform integration)', type='api_key', scope_level='global', is_active=True, settings={'scopes': ['mailboxes:read', 'messages:send']}, encrypted_settings={'api_key_hashes': [digest]}))" && echo "Calendars messages channel provisioned"
          envFrom:
            - configMapRef:
                name: {{ include "common.names.fullname" . }}
            - secretRef:
                name: {{ include "messages.secretName" . }}
            - secretRef:
                name: {{ include "common.names.fullname" . }}-calendars-channel
          {{- if .Values.job.resources }}
          resources: {{- toYaml .Values.job.resources | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
