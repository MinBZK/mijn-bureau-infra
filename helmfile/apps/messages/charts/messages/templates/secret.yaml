{{- $redisUrl := printf "redis://default:%s@%s:%s" .Values.externalRedis.password .Values.externalRedis.host .Values.externalRedis.port -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "messages.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: messages
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.backend.secretKey | quote }}
  SALT_KEY: {{ .Values.backend.saltKey | quote }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  REDIS_URL: {{ printf "%s/0" $redisUrl | quote }}
  CELERY_BROKER_URL: {{ printf "%s/0" $redisUrl | quote }}
  OIDC_RP_CLIENT_SECRET: {{ .Values.authentication.client.client_secret | quote }}
  MDA_API_SECRET: {{ .Values.backend.mdaApiSecret | quote }}
  MTA_OUT_RELAY_PASSWORD: {{ .Values.backend.mtaOutRelayPassword | quote }}
  AWS_S3_SECRET_ACCESS_KEY: {{ .Values.externalObjectStore.secretKey | quote }}
  STORAGE_MESSAGE_IMPORTS_SECRET_KEY: {{ .Values.externalObjectStore.secretKey | quote }}
  STORAGE_MESSAGE_BLOBS_SECRET_KEY: {{ .Values.externalObjectStore.secretKey | quote }}
  STORAGE_MESSAGE_EXPORTS_SECRET_KEY: {{ .Values.externalObjectStore.secretKey | quote }}
  {{- if .Values.backend.keycloakClientSecret }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.backend.keycloakClientSecret | quote }}
  {{- end }}
