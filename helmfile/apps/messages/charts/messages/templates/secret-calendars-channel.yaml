{{- if and .Values.job.calendarsChannel.enabled .Values.job.calendarsChannel.channelId .Values.job.calendarsChannel.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-calendars-channel
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: messages-calendars-channel
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  CALENDARS_CHANNEL_ID: {{ .Values.job.calendarsChannel.channelId | quote }}
  CALENDARS_CHANNEL_API_KEY: {{ .Values.job.calendarsChannel.apiKey | quote }}
{{- end }}
