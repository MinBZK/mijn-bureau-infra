{{- if .Values.networkPolicy.enabled }}
{{- $components := dict "backend" .Values.backend "worker" .Values.worker "frontend" .Values.frontend "mta" .Values.mta -}}
{{- range $componentName, $component := $components }}
---
apiVersion: {{ include "common.capabilities.networkPolicy.apiVersion" $ }}
kind: NetworkPolicy
metadata:
  name: {{ include "common.names.fullname" $ }}-{{ $componentName }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $.Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: messages-{{ $componentName }}
  {{- if $.Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $.Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $.Values.commonLabels "context" $ ) | nindent 6 }}
      app.kubernetes.io/component: messages-{{ $componentName }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    {{- if $.Values.networkPolicy.allowExternalEgress }}
    - {}
    {{- else }}
    {{- include "common.networkPolicy.dnsEgress" (dict "context" $) | nindent 4 }}
    {{- with $.Values.networkPolicy.extraEgress }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
    {{- end }}
  {{- if $component.containerPorts }}
  ingress:
    - ports:
        {{- if eq $componentName "mta" }}
        - port: {{ $component.containerPorts.smtp }}
          protocol: TCP
        {{- if $.Values.mta.metrics.enabled }}
        - port: {{ $component.containerPorts.metrics }}
          protocol: TCP
        {{- end }}
        {{- else }}
        - port: {{ $component.containerPorts.http }}
          protocol: TCP
        {{- end }}
      {{- if and (ne $componentName "mta") (not $.Values.networkPolicy.allowExternal) }}
      from:
        - podSelector:
            matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $.Values.commonLabels "context" $ ) | nindent 14 }}
        {{- if $.Values.networkPolicy.addExternalClientAccess }}
        - podSelector:
            matchLabels:
              {{ template "common.names.fullname" $ }}-client: "true"
        {{- end }}
        {{- if $.Values.networkPolicy.ingressPodMatchLabels }}
        - podSelector:
            matchLabels: {{- include "common.tplvalues.render" (dict "value" $.Values.networkPolicy.ingressPodMatchLabels "context" $ ) | nindent 14 }}
        {{- end }}
        {{- if $.Values.networkPolicy.ingressNSMatchLabels }}
        - namespaceSelector:
            matchLabels: {{- include "common.tplvalues.render" (dict "value" $.Values.networkPolicy.ingressNSMatchLabels "context" $ ) | nindent 14 }}
          {{- if $.Values.networkPolicy.ingressNSPodMatchLabels }}
          podSelector:
            matchLabels:
              matchLabels: {{- include "common.tplvalues.render" (dict "value" $.Values.networkPolicy.ingressNSPodMatchLabels "context" $ ) | nindent 14 }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- with $.Values.networkPolicy.extraIngress }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
