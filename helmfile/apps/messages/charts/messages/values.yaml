## @section Inbound MTA parameters

## Pure-Python SMTP server that validates recipients and delivers mail to the API
##
mta:
  image:
    registry: ghcr.io
    repository: suitenumerique/messages-mta-in-py
    tag: main
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  replicaCount: 1
  containerPorts:
    smtp: 2525
    metrics: 9100
  extraContainerPorts: []
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  startupProbe:
    enabled: false
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}
  resourcesPreset: "micro"
  resources: {}
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    privileged: false
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  autoscaling:
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 1
      targetCPU: 80
      targetMemory: ""
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: 1
  runtimeClassName: ""
  deploymentAnnotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  extraVolumeMounts: []
  extraVolumes: []
  hostname: ""
  ## Keep this in line with the container memory limit. pymta holds each
  ## message in memory; the upstream sizing rule is roughly
  ## maxConcurrentData * maxIncomingEmailSize * 2.2 + 64 MiB.
  ## 20 is the safe default for the 512 MiB "small" preset.
  maxConcurrentData: 20
  metrics:
    enabled: false
  ## SMTP service exposed to the internet. MX records point at this address.
  ##
  service:
    type: LoadBalancer
    port: 25
    annotations: {}
    loadBalancerIP: ""
    externalTrafficPolicy: Local

## @section Database jobs

job:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  restartPolicy: OnFailure
  podAnnotations: {}
  resources: {}
  commandMigrate:
    - /bin/sh
  argsMigrate:
    - -c
    - |
      while ! python manage.py check --database default > /dev/null 2>&1
      do
        echo "Database not ready"
        sleep 2
      done
      echo "Database is ready"
      python manage.py migrate --noinput
  commandSuperuser:
    - /bin/sh
  argsSuperuser:
    - -c
    - |
      set -e
      python manage.py createsuperuser --email "$DJANGO_SUPERUSER_EMAIL" --password "$DJANGO_SUPERUSER_PASSWORD"
      python manage.py shell -c "
      import os
      from core.models import MailDomain
      name = os.environ.get('MESSAGES_BOOTSTRAP_MAIL_DOMAIN', '').strip()
      if name:
          domain, created = MailDomain.objects.get_or_create(
              name=name,
              defaults={'oidc_autojoin': os.environ.get('MESSAGES_BOOTSTRAP_MAIL_DOMAIN_OIDC_AUTOJOIN', 'true').lower() == 'true'},
          )
          print(('Created' if created else 'Existing'), 'mail domain', domain.name)
      "
      # MinIO Community does not implement PutBucketCors (it uses global CORS
      # instead), so do not fail the whole release if a bucket rejects it.
      for storage in default message-imports message-blobs message-exports; do
        python manage.py bucket_cors --storage "$storage" --set || \
          echo "WARNING: could not set CORS for $storage; continuing"
      done
  migrate:
    weight: "-20"
  superuser:
    weight: "0"
  ## Global api_key channel used by the calendars app to read mailboxes and
  ## submit mailbox invitations. Idempotent: the hook job upserts a
  ## deterministic channel id and stores the SHA-256 hash of the derived key.
  calendarsChannel:
    enabled: false
    weight: "1"
    channelId: ""
    apiKey: ""
  ## Rebuild Thread.snippet for pre-existing threads (required before
  ## FEATURE_THREAD_SNIPPET shows correct previews). Idempotent: consecutive
  ## runs resume from a cache cursor instead of restarting from the top.
  threadSnippetsBackfill:
    enabled: true
    weight: "1"
    command:
      - /bin/sh
    args:
      - -c
      - |
        python manage.py backfill_thread_snippets

