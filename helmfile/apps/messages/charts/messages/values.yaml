## @section Global parameters

global:
  ## Global Docker image parameters
  ##
  imageRegistry: ""
  imagePullSecrets: []
  ## @param global.defaultStorageClass Global default StorageClass for Persistent Volume(s)
  ##
  defaultStorageClass: ""
  security:
    allowInsecureImages: true

## @section Common parameters

kubeVersion: ""
apiVersions: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}
clusterDomain: cluster.local
extraDeploy: []
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section Cluster parameters

## Cluster routing configuration. Helmfile overrides these values through
## values-cluster-ingress.yaml.gotmpl.
##
cluster:
  routingMode: ingress
  ingress:
    type: nginx
    className: ""
    annotations: {}
  gateway: {}
  tls:
    selfSigned: false

## @section Messages parameters

messages:
  ## @param messages.sidecars Add additional sidecar containers to the messages pods
  ## e.g:
  ## sidecars:
  ##   - name: your-image-name
  ##     image: your-image
  ##     imagePullPolicy: Always
  ##     ports:
  ##       - name: portname
  ##         containerPort: 1234
  ##
  sidecars: []
  ## @param messages.initContainers Add additional init containers to the messages pods
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  ## e.g:
  ## initContainers:
  ##  - name: your-image-name
  ##    image: your-image
  ##    imagePullPolicy: Always
  ##    command: ['sh', '-c', 'echo "hello world"']
  ##
  initContainers: []

## @section Messages backend parameters

## Django REST API (gunicorn)
##
backend:
  image:
    registry: ghcr.io
    repository: suitenumerique/messages-backend
    tag: main
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  replicaCount: 1
  containerPorts:
    http: 8000
  extraContainerPorts: []
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}
  resourcesPreset: "micro"
  resources: {}
  podSecurityContext:
    enabled: true
    fsGroup: 1001
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - "ALL"
    privileged: false
    runAsUser: 1001
    runAsGroup: 1001
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  autoscaling:
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: ""
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: 1
  runtimeClassName: ""
  ## @param backend.updateStrategy.type Backend deployment strategy type
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  ##
  updateStrategy:
    type: RollingUpdate
  ## @param backend.priorityClassName Backend pods' priorityClassName
  ##
  priorityClassName: ""
  ## @param backend.lifecycleHooks for the backend container(s) to automate configuration before or after startup
  ##
  lifecycleHooks: {}
  deploymentAnnotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  command: []
  args: []
  extraEnvVars: []
  extraEnvVarsCM: ""
  extraEnvVarsSecret: ""
  extraVolumeMounts: []
  extraVolumes: []
  secretKey: ""
  saltKey: ""
  mdaApiSecret: ""
  baseUrl: ""
  ## @param backend.logoutRedirectUrl Where the browser lands after logout. Empty falls back to baseUrl.
  logoutRedirectUrl: ""
  allowedHosts: ""
  csrfTrustedOrigins: ""
  instanceUrl: ""
  languageCode: "nl-nl"
  useXForwardedFor: true
  technicalDomain: ""
  dkimSelector: "stmessages"
  dnsRecords: '[{"target":"","type":"mx","value":"10 mx1.{technical_domain}."},{"target":"","type":"mx","value":"20 mx2.{technical_domain}."},{"target":"","type":"txt","value":"v=spf1 include:_spf.{technical_domain} -all"},{"target":"_dmarc","type":"txt","value":"v=DMARC1; p=reject; adkim=s; aspf=s;"}]'
  maxIncomingEmailSize: 10485760
  maxOutgoingAttachmentSize: 20971520
  mtaOutMode: direct
  mtaOutRelayHost: ""
  mtaOutRelayUsername: ""
  mtaOutRelayPassword: ""
  mtaOutSmtpTlsSecurityLevel: may
  opensearchUrl: ""
  opensearchIndexThreads: true
  driveBaseUrl: ""
  # Store the OIDC access token (and encrypted refresh token) in the session.
  # Required for Drive integration: messages calls the Drive external API
  # with the user's access token and refreshes it proactively.
  oidcStoreTokens: false
  # Fernet key used to encrypt the stored refresh token. Must be 44 url-safe
  # base64 characters ("43 data chars + =") decoding to 32 bytes. Required
  # when oidcStoreTokens is true.
  oidcStoreRefreshTokenKey: ""
  featureAiSummary: false
  featureAiAutolabels: false
  aiBaseUrl: ""
  aiApiKey: ""
  aiModel: ""
  identityProvider: ""
  keycloakUrl: ""
  keycloakRealm: ""
  keycloakClientId: ""
  keycloakClientSecret: ""
  keycloakGroupPathPrefix: ""
  pushEnabled: false

