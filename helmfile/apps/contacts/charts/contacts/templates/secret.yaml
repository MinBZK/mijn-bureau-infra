{{- if not .Values.secrets.external }}
{{- /*

SPDX-License-Identifier: EUPL-1.2
*/}}

{{- /* Application secret: DJANGO_SECRET_KEY, DB/Redis/MinIO/OIDC credentials, etc. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "contacts.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "contacts.labels" . | nindent 4 }}
    app.kubernetes.io/component: contacts
type: Opaque
stringData:
  {{- include "common.tplvalues.render" (dict "value" .Values.appSecrets "context" $) | nindent 2 }}
{{- end }}
