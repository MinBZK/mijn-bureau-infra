{{- if eq ((.Values.cluster | default dict).routingMode | default "ingress") "gateway-api" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "contacts.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "contacts.labels" . | nindent 4 }}
    app.kubernetes.io/component: contacts
  {{- include "common.httproute.annotations" . | nindent 2 }}
spec:
  parentRefs:
    {{- include "common.httproute.parentRef" .Values.cluster.gateway | nindent 4 }}
  hostnames:
    - {{ .Values.ingress.host | quote }}
  {{- with .Values.ingress.hosts }}
    {{- range . }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- /* Caddy in the frontend proxies the backend paths, applies security
           headers and sets the forwarded client IP; keep a single backend. */}}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.ingress.path | quote }}
      filters:
        {{- include "common.httproute.hstsFilter" . | nindent 8 }}
      backendRefs:
        - name: {{ include "contacts.frontend.fullname" . }}
          port: {{ .Values.frontend.service.port }}
{{- end }}
