apiVersion: v1
kind: Service
metadata:
  name: {{ include "openai-shim.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "openai-shim.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: {{ include "openai-shim.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
