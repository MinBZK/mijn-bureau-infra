apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openai-shim.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "openai-shim.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openai-shim.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openai-shim.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "openai-shim.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: shim
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - pip install --quiet --no-cache-dir fastapi "uvicorn[standard]" httpx python-multipart && python -m uvicorn app:app --host 0.0.0.0 --port 8080
          workingDir: /app
          env:
            - name: UPSTREAM_URL
              value: {{ .Values.upstream.url | quote }}
            - name: UPSTREAM_MODEL
              value: {{ .Values.upstream.model | quote }}
            # pip installs to the user site-packages as UID 1000 has no
            # writable default home.
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: app
              mountPath: /app
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: app
          configMap:
            name: {{ include "openai-shim.fullname" . }}
            defaultMode: 0644
