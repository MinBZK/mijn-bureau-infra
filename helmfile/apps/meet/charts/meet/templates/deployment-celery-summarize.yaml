{{- if .Values.celery_summarize.enabled }}
{{- $envVars := include "meet.common.env" (list . .Values.celery_summarize) }}
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "meet.celerySummarize.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: meet-celery-summarize
  {{- if or .Values.celery_summarize.deploymentAnnotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.celery_summarize.deploymentAnnotations .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.celery_summarize.replicaCount }}
  {{- $podLabels := include "common.tplvalues.merge" (dict "values" (list .Values.celery_summarize.podLabels .Values.commonLabels) "context" .) }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
      app.kubernetes.io/component: meet-celery-summarize
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.celery_summarize.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
      labels: {{- include "common.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: meet-celery-summarize
    spec:
      {{- include "meet.celerySummarize.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ template "meet.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.celery_summarize.automountServiceAccountToken }}
      {{- if .Values.celery_summarize.affinity }}
      affinity: {{- include "common.tplvalues.render" ( dict "value" .Values.celery_summarize.affinity "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.celery_summarize.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" ( dict "value" .Values.celery_summarize.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.celery_summarize.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.tolerations "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.celery_summarize.priorityClassName }}
      priorityClassName: {{ .Values.celery_summarize.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.celery_summarize.schedulerName }}
      schedulerName: {{ .Values.celery_summarize.schedulerName | quote }}
      {{- end }}
      {{- if .Values.celery_summarize.runtimeClassName }}
      runtimeClassName: {{ .Values.celery_summarize.runtimeClassName | quote }}
      {{- end }}
      {{- if .Values.celery_summarize.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.topologySpreadConstraints "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.celery_summarize.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.celery_summarize.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.celery_summarize.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.celery_summarize.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.celery_summarize.initContainers }}
      initContainers:
        {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.initContainers "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: celery-summarize
          image: {{ template "meet.celerySummarize.image" . }}
          imagePullPolicy: {{ .Values.celery_summarize.image.pullPolicy }}
          {{- if .Values.celery_summarize.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.celery_summarize.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          {{- else if .Values.celery_summarize.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.celery_summarize.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.args "context" $) | nindent 12 }}
          {{- end }}
          {{- if or $envVars .Values.celery_summarize.extraEnvVars }}
          env:
            {{- if $envVars }}
            {{- $envVars | nindent 12 }}
            {{- end }}
            {{- if .Values.celery_summarize.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or .Values.celery_summarize.envFrom .Values.celery_summarize.extraEnvVarsCM .Values.celery_summarize.extraEnvVarsSecret }}
          envFrom:
            {{- if .Values.celery_summarize.envFrom }}
            {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.envFrom "context" $) | nindent 12 }}
            {{- end }}
            {{- if .Values.celery_summarize.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.celery_summarize.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.celery_summarize.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.celery_summarize.extraEnvVarsSecret "context" $) }}
            {{- end }}
          {{- end }}
          {{- if .Values.celery_summarize.resources }}
          resources: {{- toYaml .Values.celery_summarize.resources | nindent 12 }}
          {{- else if ne .Values.celery_summarize.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.celery_summarize.resourcesPreset) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.celery_summarize.extraVolumeMounts }}
            {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.extraVolumeMounts "context" $) | nindent 12 }}
            {{- end }}
        {{- if .Values.celery_summarize.sidecars }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.celery_summarize.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.celery_summarize.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.celery_summarize.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
{{- end }}
