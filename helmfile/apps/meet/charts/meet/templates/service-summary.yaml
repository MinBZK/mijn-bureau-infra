{{- if .Values.summary_api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meet.summaryApi.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: meet-summary
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.summary_api.service.port }}
      targetPort: http
      protocol: TCP
  {{- $podLabels := include "common.tplvalues.merge" (dict "values" (list .Values.summary_api.podLabels .Values.commonLabels) "context" .) | fromYaml }}
  selector: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: meet-summary
{{- end }}
