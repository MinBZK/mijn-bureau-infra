## @section Celery parameters

## Dictaphone Celery worker configuration.
##
celery:
  ## @param celery.image.registry Celery image registry
  ## @param celery.image.repository Celery image repository
  ## @param celery.image.tag Celery image tag
  ## @param celery.image.pullPolicy Celery image pull policy
  ##
  image:
    registry: docker.io
    repository: lasuite/dictaphone-backend
    tag: "v0.15.4"
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  ## @param celery.replicaCount Number of Celery worker replicas
  ##
  replicaCount: 1
  ## @param celery.containerPorts.http Celery container port (unused, kept for network policy compatibility)
  ##
  containerPorts:
    http: 8000
  ## @param celery.command Override the Celery worker command
  ##
  command:
    - "celery"
    - "-A"
    - "dictaphone.celery_app"
    - "worker"
    - "--loglevel=info"
    - "-Q"
    - "dictaphone-backend"
  ## @param celery.args Override the Celery worker args
