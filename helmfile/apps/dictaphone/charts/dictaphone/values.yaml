## @section Audio extractor parameters

## Audio extraction workers.
##
audioExtractor:
  ## @param audioExtractor.image.registry Audio extractor image registry
  ## @param audioExtractor.image.repository Audio extractor image repository
  ## @param audioExtractor.image.tag Audio extractor image tag
  ## @param audioExtractor.image.pullPolicy Audio extractor image pull policy
  ##
  image:
    registry: docker.io
    repository: lasuite/dictaphone-audio-extractor
    tag: "v0.15.4"
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  ## @param audioExtractor.transcodingReplicaCount Number of transcoding worker replicas
  ##
  transcodingReplicaCount: 1
  ## @param audioExtractor.validationReplicaCount Number of validation worker replicas
  ##
  validationReplicaCount: 1
  ## @param audioExtractor.containerPorts.health Audio extractor health port
