  podAffinityPreset: ""
  ## @param audioExtractor.podAntiAffinityPreset Audio worker pod anti-affinity preset
  ##
  podAntiAffinityPreset: soft
  ## @param audioExtractor.nodeAffinityPreset Audio worker node affinity preset
  ##
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  ## @param audioExtractor.affinity Audio worker pod affinity
  ##
  affinity: {}
  ## @param audioExtractor.nodeSelector Audio worker node selector
  ##
  nodeSelector: {}
  ## @param audioExtractor.tolerations Audio worker tolerations
  ##
  tolerations: []
  ## @param audioExtractor.priorityClassName Audio worker pods' priorityClassName
  ##
  priorityClassName: ""
  ## @param audioExtractor.topologySpreadConstraints Audio worker topology spread constraints
  ##
  topologySpreadConstraints: []
  ## @param audioExtractor.schedulerName Audio worker scheduler name
  ##
  schedulerName: ""
  ## @param audioExtractor.runtimeClassName Audio worker runtime class name
  ##
  runtimeClassName: ""
  ## @param audioExtractor.lifecycleHooks Audio worker lifecycle hooks
  ##
  lifecycleHooks: {}
  ## @param audioExtractor.extraEnvVars Extra environment variables for audio workers
  ##
  extraEnvVars: []
  ## @param audioExtractor.extraVolumes Extra volumes for audio worker pods
  ##
  extraVolumes: []
  ## @param audioExtractor.extraVolumeMounts Extra volume mounts for audio worker containers
  ##
  extraVolumeMounts: []
  ## @param audioExtractor.sidecars Additional sidecar containers for audio worker pods
  ##
  sidecars: []
  ## @param audioExtractor.initContainers Additional init containers for audio worker pods
  ##
  initContainers: []
  ## @param audioExtractor.workVolume Volume backing the /work workspace
  ##
  workVolume:
    emptyDir:
      sizeLimit: 4Gi
  ## @param audioExtractor.envVars Environment variables shared by both audio worker modes
  ##
  envVars:
    AUDIO_EXTRACTOR_MAX_RUNTIME_SECONDS: 900
    AUDIO_EXTRACTOR_PROCESS_TIMEOUT_SECONDS: 1200
    AUDIO_EXTRACTOR_SHUTDOWN_GRACE_SECONDS: 30
    AUDIO_EXTRACTOR_POLL_INTERVAL_SECONDS: 5
    AUDIO_EXTRACTOR_JOB_TIMEOUT_SECONDS: 300
  ## @param audioExtractor.pdb.create Enable/disable a Pod Disruption Budget for audio workers
  ## @param audioExtractor.pdb.minAvailable Minimum number/percentage of pods that should remain scheduled
  ## @param audioExtractor.pdb.maxUnavailable Maximum number/percentage of pods that may be made unavailable
  ##
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""
  ## Network policy configuration
  ##
  networkPolicy:
    enabled: true
    allowExternal: true
    allowExternalEgress: true
    ## @param audioExtractor.networkPolicy.addExternalClientAccess Allow access from pods with client label set to "true". Ignored if `allowExternal` is true.
    ##
    addExternalClientAccess: false
    ## @param audioExtractor.networkPolicy.ingressNSMatchLabels Labels to match to allow traffic from other namespaces. Ignored if `allowExternal` is true.
    ## @param audioExtractor.networkPolicy.ingressNSPodMatchLabels Pod labels to match to allow traffic from other namespaces. Ignored if `allowExternal` is true.
    ##
    ingressNSMatchLabels: {}
    ingressNSPodMatchLabels: {}
    ## @param audioExtractor.networkPolicy.ingressPodMatchLabels Labels to match to allow traffic from other pods. Ignored if `allowExternal` is true.
    ## e.g:
    ## ingressPodMatchLabels:
    ##   my-client: "true"
    ##
    ingressPodMatchLabels: {}
    extraIngress: []
    extraEgress: []

## @section S3 gateway parameters

## Restricted S3 proxy used by audio extraction workers.
##
s3Gateway:
  ## @param s3Gateway.enabled Enable the S3 gateway
  ##
  enabled: true
  ## @param s3Gateway.image.registry S3 gateway image registry
  ## @param s3Gateway.image.repository S3 gateway image repository
  ## @param s3Gateway.image.tag S3 gateway image tag
  ## @param s3Gateway.image.pullPolicy S3 gateway image pull policy
  ##
  image:
    registry: docker.io
    repository: lasuite/dictaphone-audio-extractor
    tag: "v0.15.4"
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  ## @param s3Gateway.replicaCount Number of S3 gateway replicas
  ##
  replicaCount: 2
  ## @param s3Gateway.command Override the gateway container command
  ##
  command:
    - "python"
    - "-m"
    - "audio_extractor.s3_gateway"
  ## @param s3Gateway.args Arguments for the gateway container
  ##
  args: []
  ## @param s3Gateway.rules Provider rules for the gateway
  ##
  rules: []
  ## @param s3Gateway.resourcesPreset Set gateway container resources according to one common preset
  ##
  resourcesPreset: "nano"
  ## @param s3Gateway.resources Set gateway container requests and limits
  ##
  resources: {}
  ## @param s3Gateway.podSecurityContext Gateway pods' Security Context
  ##
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001
  ## @param s3Gateway.containerSecurityContext Gateway container Security Context
  ##
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"
  ## @param s3Gateway.automountServiceAccountToken Mount Service Account token in gateway pods
  ##
  automountServiceAccountToken: false
  ## @param s3Gateway.deploymentAnnotations Gateway deployment annotations
  ##
  deploymentAnnotations: {}
  ## @param s3Gateway.podLabels Extra labels for gateway pods
  ##
  podLabels: {}
  ## @param s3Gateway.podAnnotations Gateway pods annotations
  ##
  podAnnotations: {}
  ## @param s3Gateway.podAffinityPreset Gateway pod affinity preset
  ##
  podAffinityPreset: ""
  ## @param s3Gateway.podAntiAffinityPreset Gateway pod anti-affinity preset
  ##
  podAntiAffinityPreset: soft
  ## @param s3Gateway.nodeAffinityPreset Gateway node affinity preset
  ##
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  ## @param s3Gateway.affinity Gateway pod affinity
  ##
  affinity: {}
  ## @param s3Gateway.nodeSelector Gateway node selector
  ##
  nodeSelector: {}
  ## @param s3Gateway.tolerations Gateway tolerations
  ##
  tolerations: []
  ## @param s3Gateway.priorityClassName Gateway pods' priorityClassName
  ##
  priorityClassName: ""
  ## @param s3Gateway.topologySpreadConstraints Gateway topology spread constraints
  ##
  topologySpreadConstraints: []
  ## @param s3Gateway.schedulerName Gateway scheduler name
  ##
  schedulerName: ""
  ## @param s3Gateway.runtimeClassName Gateway runtime class name
  ##
  runtimeClassName: ""
  ## @param s3Gateway.terminationGracePeriodSeconds Gateway termination grace period
  ##
  terminationGracePeriodSeconds: 45
  ## @param s3Gateway.strategy Gateway deployment strategy
  ##
  strategy: {}
  ## @param s3Gateway.lifecycleHooks Gateway lifecycle hooks
  ##
  lifecycleHooks: {}
  ## @param s3Gateway.extraEnvVars Extra environment variables for the gateway
  ##
  extraEnvVars: []
  ## @param s3Gateway.extraVolumes Extra volumes for gateway pods
  ##
  extraVolumes: []
  ## @param s3Gateway.extraVolumeMounts Extra volume mounts for the gateway
  ##
  extraVolumeMounts: []
  ## @param s3Gateway.sidecars Additional sidecar containers for gateway pods
  ##
  sidecars: []
  ## @param s3Gateway.initContainers Additional init containers for gateway pods
  ##
  initContainers: []
  ## @param s3Gateway.envVars Environment variables for the gateway
  ##
  envVars:
    S3_GATEWAY_FORCE_HTTPS: "false"
    S3_GATEWAY_MAX_UPLOAD_BYTES: "1073741824"
    S3_GATEWAY_MAX_CONCURRENT_REQUESTS: 20
    S3_GATEWAY_TIMEOUT_SECONDS: 3600
    S3_GATEWAY_SHUTDOWN_GRACE_SECONDS: 30
  ## @param s3Gateway.service.type Gateway service type
  ## @param s3Gateway.service.ports.http Gateway service port
  ## @param s3Gateway.service.targetPort Gateway container listening port
  ## @param s3Gateway.service.annotations Gateway service annotations
  ##
  service:
    type: ClusterIP
    ports:
      http: 8080
    targetPort: 8080
    annotations: {}
  ## @param s3Gateway.livenessProbe.enabled Enable livenessProbe on gateway containers
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  ## @param s3Gateway.readinessProbe.enabled Enable readinessProbe on gateway containers
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  ## @param s3Gateway.startupProbe.enabled Enable startupProbe on gateway containers
  ##
  startupProbe:
    enabled: false
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30
    successThreshold: 1
  ## @param s3Gateway.customLivenessProbe Custom livenessProbe that overrides the default one
  ##
  customLivenessProbe: {}
  ## @param s3Gateway.customReadinessProbe Custom readinessProbe that overrides the default one
  ##
  customReadinessProbe: {}
  ## @param s3Gateway.customStartupProbe Custom startupProbe that overrides the default one
  ##
  customStartupProbe: {}
  ## @param s3Gateway.pdb.create Enable/disable a Pod Disruption Budget for the gateway
  ## @param s3Gateway.pdb.minAvailable Minimum number/percentage of pods that should remain scheduled
  ## @param s3Gateway.pdb.maxUnavailable Maximum number/percentage of pods that may be made unavailable
  ##
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""
  ## Network policy configuration
  ##
  networkPolicy:
    enabled: true
    allowExternal: true
    allowExternalEgress: true
    ## @param s3Gateway.networkPolicy.addExternalClientAccess Allow access from pods with client label set to "true". Ignored if `allowExternal` is true.
    ##
    addExternalClientAccess: false
    ## @param s3Gateway.networkPolicy.ingressNSMatchLabels Labels to match to allow traffic from other namespaces. Ignored if `allowExternal` is true.
    ## @param s3Gateway.networkPolicy.ingressNSPodMatchLabels Pod labels to match to allow traffic from other namespaces. Ignored if `allowExternal` is true.
    ##
    ingressNSMatchLabels: {}
    ingressNSPodMatchLabels: {}
    ## @param s3Gateway.networkPolicy.ingressPodMatchLabels Labels to match to allow traffic from other pods. Ignored if `allowExternal` is true.
    ## e.g:
    ## ingressPodMatchLabels:
    ##   my-client: "true"
    ##
    ingressPodMatchLabels: {}
    extraIngress: []
    extraEgress: []

