## SMTP parameters
## @param smtp.host SMTP server host
## @param smtp.port SMTP server port
## @param smtp.username SMTP auth username
## @param smtp.password SMTP auth password
## @param smtp.from.email From address used on outgoing emails
## @param smtp.from.name Brand name used on outgoing emails
## @param smtp.from.logoImage Logo image URL used on outgoing emails
## @param smtp.tls.enabled Use TLS when sending email
##
smtp:
  host: ""
  port: 587
  username: ""
  password: ""
  from:
    email: ""
    name: ""
    logoImage: ""
  tls:
    enabled: true

## Jobs parameters
## @param jobs.ttlSecondsAfterFinished Period to wait before removing completed jobs
## @param jobs.backoffLimit Number of job retries
## @param jobs.restartPolicy Job restart policy
##
jobs:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  restartPolicy: Never

## @param cronJobs List of maintenance CronJobs
##
cronJobs:
  - name: delete-original-files-data
    schedule: "1 0 * * *"
    command:
      - "/bin/sh"
      - "-c"
      - "python manage.py delete_original_files_data"
  - name: auto-hard-delete-files
    schedule: "15 0 * * *"
    command:
      - "/bin/sh"
      - "-c"
      - "python manage.py auto_hard_delete_files"
  - name: clean-pending-files
    schedule: "30 0 * * *"
    command:
      - "/bin/sh"
      - "-c"
      - "python manage.py clean_pending_files"
  - name: purge-deleted-files
    schedule: "45 0 * * *"
    command:
      - "/bin/sh"
      - "-c"
      - "python manage.py purge_deleted_files"
  - name: purge-transcription-usage
    schedule: "0 1 * * *"
    command:
      - "/bin/sh"
      - "-c"
      - "python manage.py purge_transcription_usage"

