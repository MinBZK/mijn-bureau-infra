## @section Global parameters

global:
  ## @param global.imageRegistry Global Docker image registry
  ## @param global.imagePullSecrets Global Docker registry secret names as an array
  ##
  imageRegistry: ""
  imagePullSecrets: []
  ## @param global.defaultStorageClass Global default StorageClass for Persistent Volume(s)
  ##
  defaultStorageClass: ""
  ## Security parameters
  ##
  security:
    ## @param global.security.allowInsecureImages Allows skipping image verification
    ##
    allowInsecureImages: true
  ## Compatibility adaptations for Kubernetes platforms
  ##
  compatibility:
    openshift:
      ## @param global.compatibility.openshift.adaptSecurityContext Adapt the securityContext sections of the deployment to make them compatible with Openshift restricted-v2 SCC
      ##
      adaptSecurityContext: auto

## @section Common parameters

## @param kubeVersion Override Kubernetes version reported by .Capabilities
##
kubeVersion: ""
## @param nameOverride String to partially override common.names.name
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""
## @param namespaceOverride String to fully override common.names.namespace
##
namespaceOverride: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param clusterDomain Kubernetes cluster domain name
##
clusterDomain: cluster.local
## @param extraDeploy Array of extra objects to deploy with the release
##
extraDeploy: []
## Diagnostic mode
## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
## @param diagnosticMode.command Command to override all containers in the chart release
## @param diagnosticMode.args Args to override all containers in the chart release
##
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section Backend parameters

## Dictaphone backend (Django) configuration.
##
backend:
  ## @param backend.image.registry Dictaphone backend image registry
  ## @param backend.image.repository Dictaphone backend image repository
  ## @param backend.image.tag Dictaphone backend image tag
  ## @param backend.image.pullPolicy Dictaphone backend image pull policy
  ##
  image:
    registry: docker.io
    repository: lasuite/dictaphone-backend
    tag: "v0.15.4"
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  ## @param backend.logoutRedirectUrl Where the browser lands after logout. Empty falls back to the ingress base URL.
  logoutRedirectUrl: ""
  ## @param backend.secureSslRedirect Force HTTP->HTTPS redirects in Django ("true"/"false"). Should be "false" when TLS terminates at the ingress/gateway, otherwise in-cluster HTTP clients (audio-extractor pulling /api/internal/) hit a closed 443.
  secureSslRedirect: "true"
  ## @param backend.replicaCount Number of backend replicas
  ##
  replicaCount: 1
  ## @param backend.containerPorts.http Backend HTTP container port
  ##
  containerPorts:
    http: 8000
  ## @param backend.extraContainerPorts Additional backend container ports
  ##
  extraContainerPorts: []
  ## @param backend.livenessProbe.enabled Enable livenessProbe on backend containers
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  ## @param backend.readinessProbe.enabled Enable readinessProbe on backend containers
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  ## @param backend.startupProbe.enabled Enable startupProbe on backend containers
  ##
  startupProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  ## @param backend.customLivenessProbe Custom livenessProbe that overrides the default one
  ##
  customLivenessProbe: {}
  ## @param backend.customReadinessProbe Custom readinessProbe that overrides the default one
  ##
  customReadinessProbe: {}
  ## @param backend.customStartupProbe Custom startupProbe that overrides the default one
  ##
  customStartupProbe: {}
  ## @param backend.resourcesPreset Set backend container resources according to one common preset
  ##
  resourcesPreset: "micro"
  ## @param backend.resources Set backend container requests and limits
  ##
  resources: {}
  ## @param backend.podSecurityContext Backend pods' Security Context
  ##
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001
  ## @param backend.containerSecurityContext Backend container Security Context
  ##
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"
  ## @param backend.existingConfigmap Name of an existing ConfigMap with custom configuration
  ##
  existingConfigmap: ""
  ## @param backend.command Override default backend container command
  ##
  command: []
  ## @param backend.args Override default backend container args
  ##
  args: []
  ## @param backend.automountServiceAccountToken Mount Service Account token in backend pods
  ##
  automountServiceAccountToken: false
  ## @param backend.hostAliases Backend pods host aliases
  ##
  hostAliases: []
  ## @param backend.deploymentAnnotations Backend deployment annotations
  ##
  deploymentAnnotations: {}
  ## @param backend.podLabels Extra labels for backend pods
  ##
  podLabels: {}
  ## @param backend.podAnnotations Backend pods annotations
  ##
  podAnnotations: {}
  ## @param backend.podAffinityPreset Backend pod affinity preset
  ##
  podAffinityPreset: ""
  ## @param backend.podAntiAffinityPreset Backend pod anti-affinity preset
  ##
  podAntiAffinityPreset: soft
  ## @param backend.nodeAffinityPreset Backend node affinity preset
  ##
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  ## @param backend.affinity Backend pod affinity
  ##
  affinity: {}
  ## @param backend.nodeSelector Backend node selector
  ##
  nodeSelector: {}
  ## @param backend.tolerations Backend tolerations
  ##
  tolerations: []
  ## @param backend.updateStrategy.type Backend deployment strategy type
  ##
  updateStrategy:
    type: RollingUpdate
  ## @param backend.priorityClassName Backend pods' priorityClassName
  ##
  priorityClassName: ""
  ## @param backend.topologySpreadConstraints Backend topology spread constraints
  ##
  topologySpreadConstraints: []
  ## @param backend.schedulerName Backend scheduler name
  ##
  schedulerName: ""
  ## @param backend.runtimeClassName Backend runtime class name
  ##
  runtimeClassName: ""
  ## @param backend.terminationGracePeriodSeconds Backend termination grace period
  ##
  terminationGracePeriodSeconds: 30
  ## @param backend.lifecycleHooks Backend lifecycle hooks
  ##
  lifecycleHooks: {}
  ## @param backend.extraEnvVars Extra environment variables for backend containers
  ##
  extraEnvVars: []
  ## @param backend.extraEnvVarsCM Name of an existing ConfigMap with extra env vars
  ##
  extraEnvVarsCM: ""
  ## @param backend.extraEnvVarsSecret Name of an existing Secret with extra env vars
  ##
  extraEnvVarsSecret: ""
  ## @param backend.extraVolumes Extra volumes for backend pods
  ##
  extraVolumes: []
  ## @param backend.extraVolumeMounts Extra volume mounts for backend containers
  ##
  extraVolumeMounts: []
  ## @param backend.sidecars Additional sidecar containers for backend pods
  ##
  sidecars: []
  ## @param backend.initContainers Additional init containers for backend pods
  ##
  initContainers: []
  ## @param backend.pdb.create Enable/disable a Pod Disruption Budget for the backend
  ## @param backend.pdb.minAvailable Minimum number/percentage of pods that should remain scheduled
  ## @param backend.pdb.maxUnavailable Maximum number/percentage of pods that may be made unavailable
  ##
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""
  ## @param backend.autoscaling.hpa.enabled Enable HPA for backend pods
  ## @param backend.autoscaling.hpa.minReplicas Minimum number of replicas
  ## @param backend.autoscaling.hpa.maxReplicas Maximum number of replicas
  ## @param backend.autoscaling.hpa.targetCPU Target CPU utilization percentage
  ## @param backend.autoscaling.hpa.targetMemory Target Memory utilization percentage
  ##
  autoscaling:
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: ""
  ## Network policy configuration
  ## @param backend.networkPolicy.enabled Enable a NetworkPolicy for the backend
  ## @param backend.networkPolicy.allowExternal Allow connections from any pod
  ## @param backend.networkPolicy.allowExternalEgress Allow egress to any destination
  ##
  networkPolicy:
    enabled: true
    allowExternal: true
    allowExternalEgress: true
    ## @param backend.networkPolicy.addExternalClientAccess Allow access from pods with client label set to "true". Ignored if `allowExternal` is true.
    ##
    addExternalClientAccess: false
    ## @param backend.networkPolicy.ingressNSMatchLabels Labels to match to allow traffic from other namespaces. Ignored if `allowExternal` is true.
    ## @param backend.networkPolicy.ingressNSPodMatchLabels Pod labels to match to allow traffic from other namespaces. Ignored if `allowExternal` is true.
    ##
    ingressNSMatchLabels: {}
    ingressNSPodMatchLabels: {}
    ## @param backend.networkPolicy.ingressPodMatchLabels Labels to match to allow traffic from other pods. Ignored if `allowExternal` is true.
    ## e.g:
    ## ingressPodMatchLabels:
    ##   my-client: "true"
    ##
    ingressPodMatchLabels: {}
    extraIngress: []
    extraEgress: []

