{{- $redisUrl := printf "redis://default:%s@%s:%s/1" .Values.externalRedis.password .Values.externalRedis.host .Values.externalRedis.port -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: dictaphone
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.application.secretKey | quote }}
  SIMPLE_JWT_SIGNING_KEY: {{ .Values.application.jwtSigningKey | quote }}
  DB_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
  CELERY_BROKER_URL: {{ $redisUrl | quote }}
  CELERY_RESULT_BACKEND: {{ $redisUrl | quote }}
  OIDC_RP_CLIENT_SECRET: {{ .Values.authentication.client.client_secret | quote }}
  S3_DEFAULT_ACCESS_KEY_ID: {{ .Values.objectstore.accessKey | quote }}
  S3_DEFAULT_SECRET_ACCESS_KEY: {{ .Values.objectstore.secretKey | quote }}
  AUDIO_EXTRACTOR_TRANSCODING_TOKEN: {{ .Values.application.audioExtractor.transcodingToken | quote }}
  AUDIO_EXTRACTOR_VALIDATION_TOKEN: {{ .Values.application.audioExtractor.validationToken | quote }}
  AI_SERVICE_API_KEY: {{ .Values.application.ai.serviceApiKey | quote }}
  AI_WEBHOOK_API_KEY: {{ .Values.application.ai.webhookApiKey | quote }}
  {{- if .Values.smtp.host }}
  DJANGO_EMAIL_HOST_PASSWORD: {{ .Values.smtp.password | quote }}
  {{- end }}
