  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.s3Gateway.pdb.minAvailable }}
  minAvailable: {{ .Values.s3Gateway.pdb.minAvailable }}
  {{- end }}
  {{- if or .Values.s3Gateway.pdb.maxUnavailable (not .Values.s3Gateway.pdb.minAvailable) }}
