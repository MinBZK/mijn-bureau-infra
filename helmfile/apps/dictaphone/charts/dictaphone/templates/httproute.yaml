{{- if eq .Values.cluster.routingMode "gateway-api" }}
{{- if .Values.ingress.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: dictaphone
  {{- include "common.httproute.annotations" . | nindent 2 }}
spec:
  parentRefs:
    {{- include "common.httproute.parentRef" .Values.cluster.gateway | nindent 4 }}
  hostnames:
    - {{ .Values.ingress.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /admin
        - path:
            type: PathPrefix
            value: /static
        - path:
            type: PathPrefix
            value: /external-api
      filters:
        {{- include "common.httproute.hstsFilter" . | nindent 8 }}
      backendRefs:
        - name: {{ include "dictaphone.backend.fullname" . }}
          port: {{ .Values.service.backend.ports.http }}
    {{- /* Media files (playback/download) are served by the dictaphone-nginx
      release, which enforces auth via the backend's media-auth subrequest —
      Gateway API has no auth_request, hence the in-pod proxy. */}}
    - matches:
        - path:
            type: PathPrefix
            value: /media
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains; preload
              - name: Content-Security-Policy
                value: default-src 'none'
      backendRefs:
        - name: dictaphone-nginx
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        {{- include "common.httproute.hstsFilter" . | nindent 8 }}
      backendRefs:
        - name: {{ include "dictaphone.frontend.fullname" . }}
          port: {{ .Values.service.frontend.ports.http }}
{{- end }}
{{- end }}
