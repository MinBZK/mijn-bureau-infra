apiVersion: v1
kind: Secret
metadata:
  name: {{ template "dictaphone.superuserSecretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: dictaphone
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  DJANGO_SUPERUSER_EMAIL: {{ .Values.application.superuser.email | quote }}
  DJANGO_SUPERUSER_PASSWORD: {{ .Values.application.superuser.password | quote }}
