{{- if .Values.s3Gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "dictaphone.s3Gateway.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: s3-gateway
  {{- if or .Values.s3Gateway.service.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.s3Gateway.service.annotations .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.s3Gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.s3Gateway.service.ports.http }}
      targetPort: http
      protocol: TCP
  selector: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: s3-gateway
{{- end }}
