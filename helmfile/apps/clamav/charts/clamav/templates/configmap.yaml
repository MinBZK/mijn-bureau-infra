apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: clamav
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  # Ref: https://github.com/Cisco-Talos/clamav/blob/main/etc/clamd.conf.sample
  clamd.conf: |
    LogTime yes
    ExtendedDetectionInfo yes
    DatabaseDirectory {{ .Values.persistence.mountPath }}
    LocalSocket /tmp/clamd.sock
    #TCPAddr 0.0.0.0
    TCPSocket {{ .Values.clamav.containerPorts.clamav }}
    StreamMaxLength {{ .Values.clamav.configuration.streamMaxLength }}
    Foreground yes
    {{- if .Values.clamav.configuration.debug }}
    Debug yes
    LogVerbose yes
    LeaveTemporaryFiles yes
    {{- end }}

  # Ref: https://github.com/Cisco-Talos/clamav/blob/main/etc/freshclam.conf.sample
  freshclam.conf: |
    DatabaseDirectory {{ .Values.persistence.mountPath }}
    DatabaseMirror database.clamav.net
    LogTime yes
    Foreground yes
    {{- if .Values.clamav.configuration.debug }}
    LogVerbose yes
    Debug yes
    {{- end }}

  {{- if .Values.clamav.configuration.milter.enabled }}
  # Ref: https://github.com/Cisco-Talos/clamav/blob/main/etc/clamav-milter.conf.sample
  clamd-milter.conf: |
    MilterSocket inet:{{ .Values.clamav.containerPorts.milter }}
    Foreground yes
    ClamdSocket unix:/tmp/clamd.sock
    MaxFileSize {{ .Values.clamav.configuration.milter.maxFileSize }}
    LogTime yes
    LogInfected Basic
    {{- if .Values.clamav.configuration.debug }}
    LogVerbose yes
    LogClean Basic
    {{- end }}
  {{- end }}

  {{- if .Values.clamav.icap.enabled }}
  # clamd config for the embedded ClamAV daemon of the ICAP sidecar. Containers
  # in a pod share the network namespace, so it must use its own TCP port; the
  # main clamd keeps 3310. The embedded daemon runs inside the same container
  # as c-icap, so the zSCAN temp files under /tmp are visible to it directly.
  clamd-icap.conf: |
    DatabaseDirectory /var/lib/clamav
    LogTime yes
    ExtendedDetectionInfo yes
    LogFile /var/log/clamav/clamd-icap.log
    LocalSocket /tmp/clamd-icap.sock
    TCPAddr 127.0.0.1
    TCPSocket {{ .Values.clamav.icap.clamdPort }}
    StreamMaxLength {{ .Values.clamav.configuration.streamMaxLength }}
    TemporaryDirectory /tmp

  # clamd_mod connects to the embedded clamd over its dedicated TCP port.
  # Ref: https://c-icap.sourceforge.net/c-icap-modules.conf.html
  clamd-mod-icap.conf: |
    Module common clamd_mod.so
    clamd_mod.ClamdHost 127.0.0.1
    clamd_mod.ClamdPort {{ .Values.clamav.icap.clamdPort }}
  {{- end }}
