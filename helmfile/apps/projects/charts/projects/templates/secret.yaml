apiVersion: v1
kind: Secret
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: projects
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.projects.secretKey | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/%s" .Values.externalDatabase.username .Values.externalDatabase.password .Values.externalDatabase.host .Values.externalDatabase.port .Values.externalDatabase.database | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.authentication.client.client_secret | default "" | quote }}
  {{- if .Values.projects.adminPassword }}
  DEFAULT_ADMIN_PASSWORD: {{ .Values.projects.adminPassword | quote }}
  {{- end }}
  {{- if .Values.externalRedis.host }}
  REDIS_URL: {{ printf "redis://default:%s@%s:%s/0" .Values.externalRedis.password .Values.externalRedis.host .Values.externalRedis.port | quote }}
  {{- end }}
  S3_ACCESS_KEY_ID: {{ .Values.externalMinio.accessKey | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.externalMinio.secretKey | quote }}
  {{- if .Values.smtp.host }}
  SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
  {{- end }}
