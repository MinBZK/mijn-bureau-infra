## @section Traffic Exposure Parameters

## Projects service parameters
##
service:
  ## @param service.type Projects service type
  ##
  type: ClusterIP
  ## @param service.ports.http Projects service HTTP port
  ##
  ports:
    http: 80
  ## @param service.nodePorts.http Node port for HTTP
  ##
  nodePorts:
    http: ""
  ## @param service.clusterIP Projects service Cluster IP
  ##
  clusterIP: ""
  ## @param service.loadBalancerIP Projects service Load Balancer IP
  ##
  loadBalancerIP: ""
  ## @param service.loadBalancerSourceRanges Projects service Load Balancer sources
  ##
  loadBalancerSourceRanges: []
  ## @param service.externalTrafficPolicy Projects service external traffic policy
  ##
  externalTrafficPolicy: Cluster
  ## @param service.annotations Additional custom annotations for Projects service
  ##
  annotations: {}
  ## @param service.extraPorts Extra ports to expose in Projects service
  ##
  extraPorts: []
  ## @param service.sessionAffinity Control where client requests go, to the same pod or round-robin
  ##
  sessionAffinity: None
  ## @param service.sessionAffinityConfig Additional settings for the sessionAffinity
  ##
  sessionAffinityConfig: {}

## Network Policies
## @param networkPolicy.enabled Specifies whether a NetworkPolicy should be created
## @param networkPolicy.allowExternal Don't require server label for connections
## @param networkPolicy.allowExternalEgress Allow the pod to access any range of port and all destinations
## @param networkPolicy.extraIngress Add extra ingress rules to the NetworkPolicy
## @param networkPolicy.extraEgress Add extra egress rules to the NetworkPolicy
##
networkPolicy:
  enabled: true
  allowExternal: true
  allowExternalEgress: true
  extraIngress: []
  extraEgress: []

## Projects ingress parameters
##
ingress:
  ## @param ingress.enabled Enable ingress record generation for Projects
  ##
  enabled: true
  ## @param ingress.pathType Ingress path type
  ##
  pathType: Prefix
  ## @param ingress.apiVersion Force Ingress API version (automatically detected if not set)
  ##
  apiVersion: ""
  ## @param ingress.hostname Default host for the ingress record
  ##
  hostname: projects.local
  ## @param ingress.ingressClassName IngressClass that will be used to implement the Ingress
  ##
  ingressClassName: ""
  ## @param ingress.path Default path for the ingress record
  ##
  path: /
  ## @param ingress.annotations Additional annotations for the Ingress resource
  ##
  annotations: {}
  ## @param ingress.tls Enable TLS configuration for the host defined at `ingress.hostname`
  ##
  tls: false
  ## @param ingress.selfSigned Create a TLS secret for this ingress record using self-signed certificates
  ##
  selfSigned: false
  ## @param ingress.extraHosts An array with additional hostname(s) to be covered with the ingress record
  ##
  extraHosts: []
  ## @param ingress.extraPaths An array with additional arbitrary paths that may need to be added to the ingress under the main host
  ##
  extraPaths: []
  ## @param ingress.extraTls TLS configuration for additional hostname(s) to be covered with this ingress record
  ##
  extraTls: []
  ## @param ingress.secrets Custom TLS certificates as secrets
  ##
  secrets: []
  ## @param ingress.extraRules Additional rules to be covered with this ingress record
  ##
  extraRules: []

## @section Persistence Parameters

## Persistent storage for uploaded files
##
persistence:
  ## User avatars volume
  ## @param persistence.public.enabled Enable persistence for user avatars
  ## @param persistence.public.storageClass Storage class of backing PVC
  ## @param persistence.public.accessModes Persistent Volume Access Modes
  ## @param persistence.public.size Size of data volume
  ## @param persistence.public.existingClaim The name of an existing PVC to use
  ##
  public:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations: {}
    existingClaim: ""
  ## Project background images volume
  ## @param persistence.backgrounds.enabled Enable persistence for project background images
  ## @param persistence.backgrounds.storageClass Storage class of backing PVC
  ## @param persistence.backgrounds.accessModes Persistent Volume Access Modes
  ## @param persistence.backgrounds.size Size of data volume
  ## @param persistence.backgrounds.existingClaim The name of an existing PVC to use
  ##
  backgrounds:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    annotations: {}
    existingClaim: ""
  ## Attachments volume
  ## @param persistence.attachments.enabled Enable persistence for attachments
  ## @param persistence.attachments.storageClass Storage class of backing PVC
  ## @param persistence.attachments.accessModes Persistent Volume Access Modes
  ## @param persistence.attachments.size Size of data volume
  ## @param persistence.attachments.existingClaim The name of an existing PVC to use
  ##
  attachments:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    annotations: {}
    existingClaim: ""

## @section Other Parameters

## ServiceAccount configuration
## @param serviceAccount.create Specifies whether a ServiceAccount should be created
## @param serviceAccount.name The name of the ServiceAccount to use
## @param serviceAccount.annotations Additional Service Account annotations
## @param serviceAccount.automountServiceAccountToken Automount service account token
##
serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

## @param cluster Kubernetes cluster routing configuration (populated by shared values)
##
cluster:
  routingMode: ingress
  ingress:
    type: nginx
    className: ""
  gateway:
    name: ""
    namespace: ""
  tls:
    selfSigned: false
