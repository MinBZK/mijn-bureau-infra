## @section Global parameters

global:
  ## @param global.imageRegistry Global Docker image registry
  ## @param global.imagePullSecrets Global Docker registry secret names as an array
  ##
  imageRegistry: ""
  imagePullSecrets: []
  ## @param global.defaultStorageClass Global default StorageClass for Persistent Volume(s)
  ##
  defaultStorageClass: ""
  ## Security parameters
  ##
  security:
    ## @param global.security.allowInsecureImages Allows skipping image verification
    ##
    allowInsecureImages: true

## @section Common parameters

## @param kubeVersion Override Kubernetes version reported by .Capabilities
##
kubeVersion: ""
## @param nameOverride String to partially override common.names.name
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""
## @param namespaceOverride String to fully override common.names.namespace
##
namespaceOverride: ""
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param clusterDomain Kubernetes cluster domain name
##
clusterDomain: cluster.local
## @param extraDeploy Array of extra objects to deploy with the release
##
extraDeploy: []
## Diagnostic mode
## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
## @param diagnosticMode.command Command to override all containers in the chart release
## @param diagnosticMode.args Args to override all containers in the chart release
##
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section Projects parameters

## Projects application configuration
##
projects:
  ## Projects image
  ## ref: https://hub.docker.com/r/lasuite/projects/tags/
  ## @param projects.image.registry Projects image registry
  ## @param projects.image.repository Projects image repository
  ## @param projects.image.tag Projects image tag (immutable tags are recommended)
  ## @param projects.image.digest Projects image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
  ## @param projects.image.pullPolicy Projects image pull policy
  ## @param projects.image.pullSecrets Projects image pull secrets
  ##
  image:
    registry: docker.io
    repository: lasuite/projects
    tag: "1.27.13"
    digest: ""
    pullPolicy: Always
    pullSecrets: []
  ## @param projects.secretKey Secret used to sign session cookies
  ##
  secretKey: ""
  ## @param projects.baseUrl Public URL of the application
  ##
  baseUrl: ""
  ## @param projects.serviceName Display name of the service
  ##
  serviceName: "Projecten"
  ## @param projects.allowAllToCreateProjects Allow any authenticated user to create projects
  ##
  allowAllToCreateProjects: true
  ## @param projects.adminEmail Email of the default admin user seeded on first initialization
  ##
  adminEmail: ""
  ## @param projects.adminPassword Password of the default admin user seeded on first initialization
  ##
  adminPassword: ""
  ## Object storage configuration
  ## @param projects.s3.enabled Store uploads in S3-compatible object storage instead of local volumes
  ##
  s3:
    enabled: false
  ## @param projects.replicaCount Number of Projects replicas to deploy
  ##
  replicaCount: 1
  ## @param projects.containerPorts.http Projects HTTP container port
  ##
  containerPorts:
    http: 1337
  ## @param projects.extraContainerPorts Optionally specify extra list of additional ports for Projects containers
  ##
  extraContainerPorts: []
  ## Configure extra options for Projects containers' liveness and readiness probes
  ## @param projects.livenessProbe.enabled Enable livenessProbe on Projects containers
  ## @param projects.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  ## @param projects.livenessProbe.periodSeconds Period seconds for livenessProbe
  ## @param projects.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  ## @param projects.livenessProbe.failureThreshold Failure threshold for livenessProbe
  ## @param projects.livenessProbe.successThreshold Success threshold for livenessProbe
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  ## @param projects.readinessProbe.enabled Enable readinessProbe on Projects containers
  ## @param projects.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ## @param projects.readinessProbe.periodSeconds Period seconds for readinessProbe
  ## @param projects.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  ## @param projects.readinessProbe.failureThreshold Failure threshold for readinessProbe
  ## @param projects.readinessProbe.successThreshold Success threshold for readinessProbe
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  ## @param projects.startupProbe.enabled Enable startupProbe on Projects containers
  ## @param projects.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  ## @param projects.startupProbe.periodSeconds Period seconds for startupProbe
  ## @param projects.startupProbe.timeoutSeconds Timeout seconds for startupProbe
  ## @param projects.startupProbe.failureThreshold Failure threshold for startupProbe
  ## @param projects.startupProbe.successThreshold Success threshold for startupProbe
  ##
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 30
    successThreshold: 1
  ## @param projects.customLivenessProbe Custom livenessProbe that overrides the default one
  ##
  customLivenessProbe: {}
  ## @param projects.customReadinessProbe Custom readinessProbe that overrides the default one
  ##
  customReadinessProbe: {}
  ## @param projects.customStartupProbe Custom startupProbe that overrides the default one
  ##
  customStartupProbe: {}
  ## @param projects.resourcesPreset Set Projects container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge)
  ##
  resourcesPreset: "micro"
  ## @param projects.resources Set Projects container requests and limits for different resources like CPU or memory
  ##
  resources: {}
  ## @param projects.podSecurityContext.enabled Enable Projects pods' Security Context
  ## @param projects.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy for Projects pods
  ## @param projects.podSecurityContext.sysctls Set kernel settings using the sysctl interface for Projects pods
  ## @param projects.podSecurityContext.supplementalGroups Set filesystem extra groups for Projects pods
  ## @param projects.podSecurityContext.fsGroup Set fsGroup in Projects pods' Security Context
  ##
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001
  ## @param projects.containerSecurityContext.enabled Enabled Projects container' Security Context
  ## @param projects.containerSecurityContext.runAsUser Set runAsUser in Projects container' Security Context
  ## @param projects.containerSecurityContext.runAsGroup Set runAsGroup in Projects container' Security Context
  ## @param projects.containerSecurityContext.runAsNonRoot Set runAsNonRoot in Projects container' Security Context
  ## @param projects.containerSecurityContext.readOnlyRootFilesystem Set readOnlyRootFilesystem in Projects container' Security Context
  ## @param projects.containerSecurityContext.allowPrivilegeEscalation Set allowPrivilegeEscalation in Projects container' Security Context
  ##
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"
  ## @param projects.existingConfigmap The name of an existing ConfigMap with your custom configuration for Projects
  ##
  existingConfigmap: ""
  ## @param projects.command Override default Projects container command
  ##
  command: []
  ## @param projects.args Override default Projects container args
  ##
  args: []
  ## @param projects.automountServiceAccountToken Mount Service Account token in Projects pods
  ##
  automountServiceAccountToken: false
  ## @param projects.hostAliases Projects pods host aliases
  ##
  hostAliases: []
  ## @param projects.deploymentAnnotations Annotations for Projects deployment
  ##
  deploymentAnnotations: {}
  ## @param projects.podLabels Extra labels for Projects pods
  ##
  podLabels: {}
  ## @param projects.podAnnotations Annotations for Projects pods
  ##
  podAnnotations: {}
  ## @param projects.podAffinityPreset Pod affinity preset. Allowed values: `soft` or `hard`
  ##
  podAffinityPreset: ""
  ## @param projects.podAntiAffinityPreset Pod anti-affinity preset. Allowed values: `soft` or `hard`
  ##
  podAntiAffinityPreset: soft
  ## @param projects.nodeAffinityPreset.type Node affinity preset type. Allowed values: `soft` or `hard`
  ## @param projects.nodeAffinityPreset.key Node label key to match
  ## @param projects.nodeAffinityPreset.values Node label values to match
  ##
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  ## @param projects.affinity Affinity for Projects pods assignment
  ##
  affinity: {}
  ## @param projects.nodeSelector Node labels for Projects pods assignment
  ##
  nodeSelector: {}
  ## @param projects.tolerations Tolerations for Projects pods assignment
  ##
  tolerations: []
  ## @param projects.updateStrategy.type Projects deployment strategy type
  ##
  updateStrategy:
    type: RollingUpdate
  ## @param projects.priorityClassName Projects pods' priorityClassName
  ##
  priorityClassName: ""
  ## @param projects.topologySpreadConstraints Topology Spread Constraints for Projects pod assignment
  ##
  topologySpreadConstraints: []
  ## @param projects.schedulerName Name of the k8s scheduler for Projects pods
  ##
  schedulerName: ""
  ## @param projects.runtimeClassName Name of the runtime class name for Projects pods
  ##
  runtimeClassName: ""
  ## @param projects.terminationGracePeriodSeconds Seconds Projects pods need to terminate gracefully
  ##
  terminationGracePeriodSeconds: ""
  ## @param projects.lifecycleHooks for Projects containers to automate configuration before or after startup
  ##
  lifecycleHooks: {}
  ## @param projects.extraEnvVars Array with extra environment variables to add to Projects containers
  ##
  extraEnvVars: []
  ## @param projects.extraEnvVarsCM Name of existing ConfigMap containing extra env vars for Projects containers
  ##
  extraEnvVarsCM: ""
  ## @param projects.extraEnvVarsSecret Name of existing Secret containing extra env vars for Projects containers
  ##
  extraEnvVarsSecret: ""
  ## @param projects.extraVolumes Optionally specify extra list of additional volumes for the Projects pods
  ##
  extraVolumes: []
  ## @param projects.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the Projects containers
  ##
  extraVolumeMounts: []
  ## @param projects.sidecars Add additional sidecar containers to the Projects pods
  ##
  sidecars: []
  ## @param projects.initContainers Add additional init containers to the Projects pods
  ##
  initContainers: []
  ## Pod Disruption Budget configuration
  ## @param projects.pdb.create Enable/disable a Pod Disruption Budget creation
  ## @param projects.pdb.minAvailable Minimum number/percentage of pods that should remain scheduled
  ## @param projects.pdb.maxUnavailable Maximum number/percentage of pods that may be made unavailable
  ##
  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""
  ## Autoscaling configuration
  ## @param projects.autoscaling.hpa.enabled Enable HPA for Projects pods
  ## @param projects.autoscaling.hpa.minReplicas Minimum number of replicas
  ## @param projects.autoscaling.hpa.maxReplicas Maximum number of replicas
  ## @param projects.autoscaling.hpa.targetCPU Target CPU utilization percentage
  ## @param projects.autoscaling.hpa.targetMemory Target Memory utilization percentage
  ##
  autoscaling:
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: ""

## @section Authentication parameters

## OpenID Connect configuration
##
authentication:
  ## @param authentication.issuer OIDC issuer URL
  ##
  issuer: ""
  ## @param authentication.fullnameAttributes Comma-separated OIDC claims used to build the display name
  ##
  fullnameAttributes: "name"
  ## @param authentication.scopes Space-separated OIDC scopes
  ##
  scopes: "openid email profile"
  ## @param authentication.emailAttribute OIDC claim used as the user's email
  ##
  emailAttribute: "email"
  ## @param authentication.enforced Require OIDC login
  ##
  enforced: true
  ## Client configuration
  ##
  client:
    client_id: ""
    client_secret: ""

