{{- if and .Values.ingress.enabled (eq .Values.cluster.routingMode "ingress") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "seaweedfs.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.ingress.annotations .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "common.tplvalues.render" (dict "value" $annotations "context" .) | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.cluster.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ tpl .Values.ingress.hostname . | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "common.names.fullname" . }}
                port:
                  name: s3
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ tpl .Values.ingress.hostname . | quote }}
      secretName: {{ printf "%s-tls" (include "common.names.fullname" .) }}
  {{- end }}
{{- end }}
