{{- /*
SPDX-License-Identifier: Apache-2.0

Only rendered when credentials are managed by the chart. With External
Secrets (secrets.backend=external) `auth.existingSecret` is set and the
ExternalSecret owns the Secret instead.
*/}}
{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "seaweedfs.labels" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" .) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ .Values.auth.accessKeyKey }}: {{ required "auth.accessKey is required when auth.enabled and auth.existingSecret is empty" .Values.auth.accessKey | b64enc | quote }}
  {{ .Values.auth.secretKeyKey }}: {{ required "auth.secretKey is required when auth.enabled and auth.existingSecret is empty" .Values.auth.secretKey | b64enc | quote }}
{{- end }}
