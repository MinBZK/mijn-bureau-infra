global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: docker.io
  repository: nginx/nginx-unprivileged
  tag: 1.30.6-alpine-slim
  pullPolicy: Always
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

commonLabels: {}
commonAnnotations: {}

replicaCount: 1
revisionHistoryLimit: 10

podLabels: {}
podAnnotations: {}
podSecurityContext: {}
containerSecurityContext: {}

containerPorts:
  http: 8080

service:
  type: ClusterIP
  ports:
    http: 80
  targetPort:
    http: http
  annotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

resources: {}
resourcesPreset: "none"

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

startupProbe:
  enabled: false
  initialDelaySeconds: 30
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 6
  successThreshold: 1
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  timeoutSeconds: 5
  periodSeconds: 10
  failureThreshold: 6
  successThreshold: 1
readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 5
  timeoutSeconds: 3
  periodSeconds: 5
  failureThreshold: 3
  successThreshold: 1
customStartupProbe: {}
customLivenessProbe: {}
customReadinessProbe: {}

serverBlock: ""
extraVolumes: []
extraVolumeMounts: []
extraDeploy: []

networkPolicy:
  enabled: true
  allowExternal: true
  allowExternalEgress: false
  extraIngress: []
  extraEgress: []
  ingressNSMatchLabels: {}
  ingressNSPodMatchLabels: {}

ingress:
  enabled: false
  hostname: ""
  path: /
  pathType: Prefix
  ingressClassName: ""
  annotations: {}
  tls: false
  selfSigned: false
  extraPaths: []
  extraHosts: []
  extraTls: []
  secrets: []
  extraRules: []

pdb:
  create: false
  minAvailable: ""
  maxUnavailable: ""

metrics:
  enabled: false
  image:
    registry: docker.io
    repository: nginx/nginx-prometheus-exporter
    tag: 1.5.3
    pullPolicy: Always
  containerPorts:
    metrics: 9113
  service:
    port: 9113
    annotations: {}
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    labels: {}
    relabelings: []
    metricRelabelings: []
  prometheusRule:
    enabled: false
    namespace: ""
    additionalLabels: {}
    rules: []
  resources: {}
  resourcesPreset: "nano"
