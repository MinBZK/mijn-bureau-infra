# Baseline network isolation per application namespace.
#
# The chart creates one default-deny-ingress NetworkPolicy per namespace:
# inbound traffic is only accepted from pods of the same namespace, or from
# sources an application chart's own NetworkPolicy explicitly allows.
#
# With egress.enabled it also creates a default-deny-egress NetworkPolicy:
# outbound traffic is only allowed to same-namespace pods, cluster DNS,
# TCP/443 (Kubernetes API / HTTPS endpoints) and allowedCrossNamespaceEgress.
# NetworkPolicies are additive, so this only restricts pods that no other
# egress-allowing policy covers.

## @param commonLabels Labels to add to all NetworkPolicies rendered by this chart
##
commonLabels: {}

## @param commonAnnotations Annotations to add to all NetworkPolicies rendered by this chart
##
commonAnnotations: {}

## @param allowedCrossNamespaceIngress Explicit cross-namespace inbound
## exceptions applied to every covered namespace, e.g. an operator that must
## manage workloads inside the application namespaces.
## Example:
## allowedCrossNamespaceIngress:
##   - name: cnpg-system
##     ports: [8000]
##
allowedCrossNamespaceIngress: []

## Egress baseline. When enabled, every covered namespace also gets a
## default-deny-egress NetworkPolicy: outbound traffic is only allowed to
## same-namespace pods, cluster DNS (dns.*), TCP/443 (Kubernetes API and
## other HTTPS endpoints), and the entries in allowedCrossNamespaceEgress
## (e.g. cluster-internal OIDC and mail submission).
egress:
  enabled: false

## @param dns DNS egress settings for the default-deny-egress policy; mirrors
## cluster.networking.dns.
dns:
  external:
    port: 53
  internal:
    port: ~
    namespace: ~

## @param allowedCrossNamespaceEgress Cross-namespace outbound exceptions
## applied in every covered namespace.
## Example:
## allowedCrossNamespaceEgress:
##   - name: mijnbureau-keycloak
##     ports: [80, 443]
##
allowedCrossNamespaceEgress: []

## @param namespaces Volumes to protect. Every entry creates a default-deny-ingress NetworkPolicy in that namespace.
## Example:
## namespaces:
##   - name: mijnbureau-docs
##   - name: mijnbureau-drive
##     # Optionally disable the policy while keeping the namespace listed.
##     enabled: true
##
namespaces: []
