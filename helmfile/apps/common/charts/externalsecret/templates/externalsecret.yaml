{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .name | quote }}
  namespace: {{ .namespace | default $.Release.Namespace | quote }}
spec:
  refreshInterval: {{ .refreshInterval | default "1m" | quote }}
  secretStoreRef:
    name: {{ .store | default $.Values.store.name | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .target | quote }}
    creationPolicy: Owner
    {{- if or .type .staticData }}
    template:
      {{- if .type }}
      type: {{ .type | quote }}
      {{- end }}
      data:
      {{- range $k, $v := .staticData }}
        {{ $k }}: {{ $v | quote }}
      {{- end }}
      {{- range .data }}
        {{ .secretKey }}: {{ printf "{{ .%s }}" .secretKey | quote }}
      {{- end }}
    {{- end }}
  data:
  {{- range .data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .remoteKey | quote }}
      {{- if .property }}
        property: {{ .property | quote }}
      {{- end }}
  {{- end }}
{{- end }}
