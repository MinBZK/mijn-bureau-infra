{{- if .Values.store.create }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.store.name | quote }}
spec:
  provider:
    vault:
      server: {{ .Values.store.server | quote }}
      path: {{ printf "%s/%s" .Values.store.mount .Values.store.pathPrefix | quote }}
      version: {{ .Values.store.version | default "v2" | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.store.auth.kubernetes.mountPath | default "kubernetes" | quote }}
          role: {{ .Values.store.auth.kubernetes.role | quote }}
          serviceAccountRef:
            name: {{ .Values.store.auth.kubernetes.serviceAccount | quote }}
          audiences:
            - {{ .Values.store.auth.kubernetes.audience | default "vault" | quote }}
{{- end }}
