{{- if and .Values.jwtKeys.enabled (not .Values.jwtKeys.existingSecret) }}
apiVersion: {{ include "common.capabilities.job.apiVersion" . }}
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-jwt-keys
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: jwt-keys
  annotations:
    # Pre-install/pre-upgrade: the secret must exist before any pod reading it
    # rolls. Idempotent: an existing secret is left untouched, key rotation is
    # a deliberate delete of the secret plus a re-run.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: jwt-keys
    spec:
      {{- include "menshen.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "common.names.fullname" . }}-jwt-keys
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- if .Values.menshen.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.menshen.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      initContainers:
        - name: generate
          # alpine/openssl's entrypoint is openssl itself; override with a shell.
          image: {{ include "common.images.image" (dict "imageRoot" .Values.jwtKeys.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.jwtKeys.image.pullPolicy }}
          {{- if .Values.menshen.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.menshen.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # RSA private key for signing exchanged JWT tokens.
              openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /keys/private.pem
              # TOKEN_EXCHANGE_JWT_SIGNING_KEYS is a JSON dict {kid: pem}.
              awk 'BEGIN { printf "{\"%s\":\"", "{{ .Values.jwtKeys.currentKid }}" }
                   { printf "%s\\n", $0 }
                   END { printf "\"}" }' /keys/private.pem > /keys/signing-keys.json
          resources:
            {{- toYaml (dict "requests" (dict "cpu" "10m" "memory" "32Mi") "limits" (dict "cpu" "100m" "memory" "64Mi")) | nindent 12 }}
          volumeMounts:
            - name: keys
              mountPath: /keys
      containers:
        - name: publish
          image: {{ include "common.images.image" (dict "imageRoot" .Values.jwtKeys.kubectlImage "global" .Values.global) }}
          imagePullPolicy: {{ .Values.jwtKeys.kubectlImage.pullPolicy }}
          {{- if .Values.menshen.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.menshen.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if kubectl get secret {{ include "menshen.jwtKeys.secretName" . }} > /dev/null 2>&1; then
                echo "secret {{ include "menshen.jwtKeys.secretName" . }} already exists, keys unchanged"
                exit 0
              fi
              kubectl create secret generic {{ include "menshen.jwtKeys.secretName" . }} \
                --from-file=TOKEN_EXCHANGE_JWT_SIGNING_KEYS=/keys/signing-keys.json
          resources:
            {{- toYaml (dict "requests" (dict "cpu" "10m" "memory" "32Mi") "limits" (dict "cpu" "100m" "memory" "64Mi")) | nindent 12 }}
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
      volumes:
        - name: keys
          emptyDir:
            medium: Memory
{{- end }}
