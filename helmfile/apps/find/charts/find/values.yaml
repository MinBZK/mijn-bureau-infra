## @section Global parameters

global:
  imageRegistry: ""
  imagePullSecrets: []
  defaultStorageClass: ""
  security:
    allowInsecureImages: false

## @section Common parameters

kubeVersion: ""
apiVersions: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""
commonLabels: {}
commonAnnotations: {}
clusterDomain: cluster.local
extraDeploy: []
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section find parameters
## Find has a single component: the Django ASGI backend (uvicorn). It serves
## the indexing/search API and the Django admin.

find:
  image:
    registry: docker.io
    repository: lasuite/find
    tag: main
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
  replicaCount: 1
  containerPorts:
    http: 8000
  extraContainerPorts: []
  command: []
  args: []
  automountServiceAccountToken: false
  hostAliases: []

  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startupProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 60
  customLivenessProbe: {}
  customReadinessProbe: {}
  customStartupProbe: {}

  resourcesPreset: "nano"
  resources: {}
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"

  podLabels: {}
  podAnnotations: {}
  deploymentAnnotations: {}
  updateStrategy:
    type: RollingUpdate
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  topologySpreadConstraints: []
  schedulerName: ""
  runtimeClassName: ""
  terminationGracePeriodSeconds: ""
  lifecycleHooks: {}
  sidecars: []
  initContainers: []
  extraVolumes: []
  extraVolumeMounts: []

  pdb:
    create: true
    minAvailable: ""
    maxUnavailable: ""

  autoscaling:
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 80
      targetMemory: ""
    vpa:
      enabled: false
      annotations: {}
      controlledResources: []
      maxAllowed: {}
      minAllowed: {}
      updatePolicy:
        updateMode: Recreate

  ## Non-sensitive environment variables, rendered in the chart ConfigMap.
  envVars: {}

service:
  type: ClusterIP
  ports:
    http: 8000
  nodePorts:
    http: ""
  clusterIP: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: Cluster
  annotations: {}
  extraPorts: []
  sessionAffinity: None
  sessionAffinityConfig: {}

networkPolicy:
  enabled: true
  # Find is served through the cluster ingress/Gateway and called by other
  # apps' backends; allow external traffic on the http port.
  allowExternal: true
  allowExternalEgress: true
  addExternalClientAccess: true
  extraIngress: []
  extraEgress: []
  ingressPodMatchLabels: {}
  ingressNSMatchLabels: {}
  ingressNSPodMatchLabels: {}

ingress:
  enabled: false
  pathType: Prefix
  apiVersion: ""
  hostname: find.local
  ingressClassName: ""
  path: /
  annotations: {}
  tls: true
  selfSigned: false
  extraHosts: []
  extraPaths: []
  extraTls: []
  extraRules: []
  secrets: []

## @section find secrets
## Rendered in the chart Secret and env-sourced by all pods (backend and jobs).
secretEnvVars: {}

## Services allowed to index into Find ("docs", "drive"). Only their token
## (exactly 50 chars, stored hashed) matters; the name doubles as the
## OpenSearch index name suffix.
services: []
## - name: docs
##   token: <50-char-token>

jobs:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 20
  migrate:
    enabled: true
  createSuperUser:
    enabled: true
  registerServices:
    enabled: true

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false
