{{- if not .Values.secrets.external }}
{{- /*

SPDX-License-Identifier: APACHE-2.0
*/}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ template "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: livekit-server
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  keyfile.txt: |
{{- range $k, $v := .Values.livekit.keys }}
    {{ $k }}: {{ $v }}
{{- end }}
  {{- if and .Values.livekit.redis.enabled .Values.livekit.redis.password }}
  REDIS_PASSWORD: {{ .Values.livekit.redis.password | quote }}
  {{- end }}
{{- end }}
