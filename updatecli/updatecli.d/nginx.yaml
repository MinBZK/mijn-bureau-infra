name: "Update nginx container tags"

scms:
  default:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"
      commitmessage:
        title: Bump nginx version to {{ source "nginx_latest_version" }}
        hidecredit: true
        squash: true
        type: "⬆️(deps)"

sources:
  nginx_latest_version:
    name: "Get latest nginx tag"
    kind: dockerimage
    spec:
      image: "nginx/nginx-unprivileged"
      architecture: amd64
      tagfilter: "^[0-9.]+-alpine-slim$"
      versionfilter:
        kind: regex/semver
        regex: "([0-9]+\\.[0-9]+\\.[0-9]+)-alpine-slim"
        pattern: ">0.0.0"

targets:
  update_nginx_tag:
    name: "Update nginx tag"
    kind: yaml
    transformers:
      - addsuffix: "-alpine-slim"
    spec:
      engine: yamlpath
      file: "helmfile/environments/default/container.yaml.gotmpl"
      key: "$.container.nginx.tag"
    sourceid: nginx_latest_version
    scmid: default

actions:
  default:
    scmid: default
    kind: github/pullrequest
    title: ⬆️(deps) Bump nginx version to {{ source "nginx_latest_version" }}
