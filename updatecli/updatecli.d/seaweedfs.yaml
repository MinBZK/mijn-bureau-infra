name: "Update seaweedfs container tags"

scms:
  default:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"
      commitmessage:
        title: Bump seaweedfs version to {{ source "seaweedfs_latest_version" }}
        hidecredit: true
        squash: true
        type: "⬆️(deps)"

sources:
  seaweedfs_latest_version:
    name: "Get latest seaweedfs tag"
    kind: dockerimage
    spec:
      image: "chrislusf/seaweedfs"
      architecture: amd64
      # SeaweedFS tags are plain numeric releases such as "4.55".
      tagfilter: "^[0-9]+\\.[0-9]+$"
      versionfilter:
        kind: semver
        pattern: ">0.0.0"

targets:
  update_seaweedfs_tag:
    name: "Update seaweedfs tag"
    kind: yaml
    spec:
      engine: yamlpath
      file: "helmfile/environments/default/container.yaml.gotmpl"
      key: "$.container.seaweedfs.tag"
    sourceid: seaweedfs_latest_version
    scmid: default

actions:
  default:
    scmid: default
    kind: github/pullrequest
    title: ⬆️(deps) Bump seaweedfs version to {{ source "seaweedfs_latest_version" }}
