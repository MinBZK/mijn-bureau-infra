      frontend: "xlarge"
      caldav: "xlarge"
    dictaphone:
      backend: "xlarge"
      frontend: "xlarge"
      celery: "xlarge"
      audioExtractor: "xlarge"
      s3Gateway: "xlarge"
    messages:
      backend: "xlarge"
      worker: "xlarge"
      frontend: "xlarge"
      mta: "xlarge"
      opensearch: "xlarge"
    conversations:
      backend: "xlarge"
      frontend: "xlarge"
