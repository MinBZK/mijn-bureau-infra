name: release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Renders the demo and production manifests, resolves every container image to
  # a digest, generates CycloneDX and SPDX SBOMs, verifies cosign signatures and
  # scans the SBOMs with Trivy. The result is a report-only inventory: unsigned
  # or unscannable images never fail the release.
  security-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install helm
        run: |
          wget -O - https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Install helmfile
        run: |
          cd /tmp/
          wget https://github.com/helmfile/helmfile/releases/download/v1.1.2/helmfile_1.1.2_linux_amd64.tar.gz
          tar -xzf helmfile_1.1.2_linux_amd64.tar.gz
          sudo mv helmfile /usr/local/bin/helmfile

      - name: Install helmfile dependencies
        run: helmfile init --force

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.4
        with:
          syft-version: v1.57.2

      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.4
        with:
          cosign-release: v3.1.6

      - name: Cache vulnerability database
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: |
            trivy-db-

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install report dependencies
        run: pip install -r scripts/requirements.txt

      # Syft unpacks image layers while generating SBOMs. Give it a private
      # scratch directory on the runner's disk and log the free space, so a
      # full disk is visible in the job output.
      - name: Prepare scratch space
        run: |
          scratch="$(mktemp -d)"
          {
            echo "TMPDIR=${scratch}"
            echo "SYFT_TEMP_DIR=${scratch}"
          } >> "$GITHUB_ENV"
          df -h "$scratch"

      # Optional Docker Hub credentials. Without them Syft pulls anonymously,
      # which is subject to the shared-IP rate limit on hosted runners.
      - name: Configure registry credentials
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            {
              echo "SYFT_REGISTRY_AUTH_AUTHORITY=docker.io"
              echo "SYFT_REGISTRY_AUTH_USERNAME=${DOCKERHUB_USERNAME}"
              echo "SYFT_REGISTRY_AUTH_PASSWORD=${DOCKERHUB_PASSWORD}"
            } >> "$GITHUB_ENV"
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate security report
        run: |
          python3 scripts/release_report.py \
            --release-tag "${{ github.ref_name }}" \
            --output-dir .release \
            --jobs 4
        env:
          MIJNBUREAU_MASTER_PASSWORD: ${{ secrets.MIJNBUREAU_MASTER_PASSWORD || 'dependabot' }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY || 'dependabot' }}

      - name: Show report summary
        run: cat .release/security/containers.md

      - name: Upload security report
        uses: actions/upload-artifact@v7
        with:
          name: release-security
          path: .release/security
          if-no-files-found: error
          retention-days: 30

  package-release:
    runs-on: ubuntu-latest
    needs: [security-report]

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download security report
        uses: actions/download-artifact@v8
        with:
          name: release-security
          path: security

      - name: Package helmfile folder
        run: |
          set -euo pipefail
          archive="helmfile-${{ github.ref_name }}.tar.gz"
          paths=(helmfile/ helmfile.yaml.gotmpl .sops.yaml cosign.pub security/)
          # Optional documents: only include what the repository actually has.
          for optional in CHANGELOG.md LICENSE README.md SECURITY.md; do
            if [ -f "$optional" ]; then paths+=("$optional"); fi
          done
          tar -czf "$archive" "${paths[@]}"
          sha256sum "$archive" > "$archive.sha256"
          tar -czf "sbom-${{ github.ref_name }}.tar.gz" -C security sbom sbom-index.json cve.json containers.json containers.md images.lock.yaml signatures.json SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.4
        with:
          cosign-release: v3.1.6

      # cosign v3 emits a Sigstore bundle instead of a detached signature. A
      # bundle contains the signature, the certificate and the transparency log
      # proof, and is verified with `cosign verify-blob --bundle`.
      - name: Sign the release artifacts with Cosign
        run: |
          for blob in \
            "helmfile-${{ github.ref_name }}.tar.gz" \
            "helmfile-${{ github.ref_name }}.tar.gz.sha256" \
            "sbom-${{ github.ref_name }}.tar.gz" \
            "security/containers.json" \
            "security/sbom-index.json" \
            "security/SHA256SUMS"; do
            cosign sign-blob --key env://COSIGN_PRIVATE_KEY -y \
              --bundle "${blob}.sigstore.json" "${blob}"
          done
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Create helmfile Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            helmfile-${{ github.ref_name }}.tar.gz
            helmfile-${{ github.ref_name }}.tar.gz.sha256
            helmfile-${{ github.ref_name }}.tar.gz.sigstore.json
            helmfile-${{ github.ref_name }}.tar.gz.sha256.sigstore.json
            sbom-${{ github.ref_name }}.tar.gz
            sbom-${{ github.ref_name }}.tar.gz.sigstore.json
            security/containers.json
            security/containers.json.sigstore.json
            security/containers.md
            security/images.lock.yaml
            security/signatures.json
            security/sbom-index.json
            security/sbom-index.json.sigstore.json
            security/cve.json
            security/SHA256SUMS
            security/SHA256SUMS.sigstore.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
